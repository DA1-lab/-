<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>錠剤カウンター</title>
<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#111;
  color:#fff;
}
header{
  padding:14px;
  background:#222;
  position:sticky;
  top:0;
  z-index:10;
}
h1{
  font-size:20px;
  margin:0 0 8px;
}
#count{
  font-size:34px;
  font-weight:800;
  color:#ff3b30;
}
main{
  padding:12px;
}
button,input[type=file]{
  font-size:16px;
  margin:6px 0;
}
button{
  padding:10px 14px;
  border-radius:10px;
  border:0;
  font-weight:700;
}
.primary{background:#0a84ff;color:white;}
.warn{background:#ff9500;color:black;}
canvas{
  width:100%;
  max-width:100%;
  background:#000;
  border-radius:12px;
  touch-action:none;
}
.panel{
  background:#1d1d1f;
  padding:12px;
  border-radius:12px;
  margin:12px 0;
}
.row{
  margin:10px 0;
}
label{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:#ddd;
}
input[type=range]{
  width:100%;
}
.small{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>
<body>

<header>
  <h1>錠剤カウンター</h1>
  <div>検出数：<span id="count">0</span></div>
</header>

<main>
  <input id="file" type="file" accept="image/*" capture="environment">
  <br>
  <button class="primary" onclick="autoDetect()">自動カウント</button>
  <button class="warn" onclick="resetManual()">手動修正リセット</button>

  <div class="panel">
    <div class="row">
      <label>しきい値 <span id="vThreshold"></span></label>
      <input id="threshold" type="range" min="0" max="255" value="0">
    </div>
    <div class="row">
      <label>最小サイズ <span id="vMinArea"></span></label>
      <input id="minArea" type="range" min="20" max="3000" value="250">
    </div>
    <div class="row">
      <label>最大サイズ <span id="vMaxArea"></span></label>
      <input id="maxArea" type="range" min="500" max="20000" value="8000">
    </div>
    <div class="row">
      <label>丸さ感度 <span id="vCircularity"></span></label>
      <input id="circularity" type="range" min="20" max="95" value="45">
    </div>
    <div class="row">
      <label>輪郭の太さ <span id="vLineWidth"></span></label>
      <input id="lineWidth" type="range" min="2" max="10" value="4">
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div class="panel small">
    <b>使い方</b><br>
    1. 写真を選ぶ<br>
    2. 自動カウント<br>
    3. 検出済みの赤丸をタップ → 除外<br>
    4. 見逃し部分をタップ → 追加<br>
    5. バーで微調整すると再検出されます
  </div>
</main>

<script async src="https://docs.opencv.org/4.x/opencv.js" onload="cvReady=true"></script>

<script>
let cvReady = false;
let img = new Image();
let originalCanvas = document.createElement("canvas");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let detections = [];
let removed = new Set();
let added = [];

const $ = id => document.getElementById(id);

["threshold","minArea","maxArea","circularity","lineWidth"].forEach(id=>{
  $(id).addEventListener("input",()=>{
    updateLabels();
    detect(false);
  });
});

$("file").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    prepareImage();
    autoDetect();
  };
  img.src = url;
});

function prepareImage(){
  const maxW = 1400;
  const scale = Math.min(1, maxW / img.width);

  originalCanvas.width = Math.round(img.width * scale);
  originalCanvas.height = Math.round(img.height * scale);

  const octx = originalCanvas.getContext("2d");
  octx.drawImage(img, 0, 0, originalCanvas.width, originalCanvas.height);

  canvas.width = originalCanvas.width;
  canvas.height = originalCanvas.height;
}

function autoDetect(){
  if(!cvReady){
    alert("画像処理エンジン読み込み中です。数秒後にもう一度押してください。");
    return;
  }
  if(!originalCanvas.width){
    alert("先に写真を選んでください。");
    return;
  }

  autoSetParams();
  removed.clear();
  added = [];
  detect(false);
}

function autoSetParams(){
  let src = cv.imread(originalCanvas);
  let gray = new cv.Mat();
  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

  let mean = cv.mean(gray)[0];

  let threshold = Math.max(70, Math.min(210, Math.round(mean * 0.88)));
  $("threshold").value = threshold;

  const pixels = originalCanvas.width * originalCanvas.height;

  $("minArea").value = Math.round(Math.max(80, pixels / 18000));
  $("maxArea").value = Math.round(Math.max(2000, pixels / 180));
  $("circularity").value = 42;
  $("lineWidth").value = 4;

  src.delete();
  gray.delete();
  updateLabels();
}

function detect(keepManual=true){
  if(!cvReady || !originalCanvas.width) return;

  if(!keepManual){
    removed.clear();
  }

  let src = cv.imread(originalCanvas);
  let gray = new cv.Mat();
  let blur = new cv.Mat();
  let bin = new cv.Mat();

  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray, blur, new cv.Size(5,5), 0);

  let t = Number($("threshold").value);

  cv.threshold(blur, bin, t, 255, cv.THRESH_BINARY_INV);

  let kernel = cv.Mat.ones(3, 3, cv.CV_8U);
  cv.morphologyEx(bin, bin, cv.MORPH_OPEN, kernel);
  cv.morphologyEx(bin, bin, cv.MORPH_CLOSE, kernel);

  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();

  cv.findContours(bin, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  detections = [];
  const minArea = Number($("minArea").value);
  const maxArea = Number($("maxArea").value);
  const minCirc = Number($("circularity").value) / 100;

  for(let i=0;i<contours.size();i++){
    let c = contours.get(i);
    let area = cv.contourArea(c);
    if(area < minArea || area > maxArea) continue;

    let peri = cv.arcLength(c, true);
    if(peri <= 0) continue;

    let circularity = 4 * Math.PI * area / (peri * peri);
    if(circularity < minCirc) continue;

    let m = cv.moments(c);
    if(m.m00 === 0) continue;

    let x = m.m10 / m.m00;
    let y = m.m01 / m.m00;

    let rect = cv.boundingRect(c);
    let r = Math.max(rect.width, rect.height) / 2;

    detections.push({
      id: i,
      x, y, r,
      area,
      circularity
    });
  }

  src.delete();
  gray.delete();
  blur.delete();
  bin.delete();
  kernel.delete();
  contours.delete();
  hierarchy.delete();

  draw();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(originalCanvas,0,0);

  const lw = Number($("lineWidth").value);
  ctx.lineWidth = lw;
  ctx.font = "bold 22px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  let visibleCount = 0;

  detections.forEach((d, idx)=>{
    if(removed.has(idx)) return;
    visibleCount++;

    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r + 4,0,Math.PI*2);
    ctx.strokeStyle = "#ff3b30";
    ctx.stroke();

    ctx.fillStyle = "#ff3b30";
    ctx.fillText(visibleCount, d.x, d.y);
  });

  added.forEach((p, i)=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.strokeStyle = "#34c759";
    ctx.stroke();

    ctx.fillStyle = "#34c759";
    ctx.fillText("+", p.x, p.y);
  });

  $("count").textContent = visibleCount + added.length;
}

canvas.addEventListener("pointerdown", e=>{
  if(!originalCanvas.width) return;

  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * canvas.width / rect.width;
  const y = (e.clientY - rect.top) * canvas.height / rect.height;

  let hit = -1;
  let best = Infinity;

  detections.forEach((d, idx)=>{
    if(removed.has(idx)) return;
    const dist = Math.hypot(x-d.x, y-d.y);
    if(dist < d.r + 18 && dist < best){
      best = dist;
      hit = idx;
    }
  });

  if(hit >= 0){
    removed.add(hit);
  }else{
    added.push({x,y,r:24});
  }

  draw();
});

function resetManual(){
  removed.clear();
  added = [];
  draw();
}

function updateLabels(){
  $("vThreshold").textContent = $("threshold").value;
  $("vMinArea").textContent = $("minArea").value;
  $("vMaxArea").textContent = $("maxArea").value;
  $("vCircularity").textContent = $("circularity").value;
  $("vLineWidth").textContent = $("lineWidth").value;
}

updateLabels();
</script>

</body>
</html>
