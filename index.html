<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PillCount Vision</title>
<script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Manrope:wght@400;600;800&display=swap');

:root {
  --bg: #f5f2eb;
  --surface: #ffffff;
  --surface2: #ede9e0;
  --ink: #1a1a18;
  --ink-dim: #6b6860;
  --accent: #e85d26;
  --accent2: #2563eb;
  --accent3: #16a34a;
  --border: #d4cfc4;
  --shadow: 0 2px 16px rgba(26,26,24,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
  min-height: 100vh;
}

/* Subtle grain texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

.app {
  max-width: 860px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 36px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--ink);
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.logo-name {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -1px;
  color: var(--ink);
}

.logo-name em {
  color: var(--accent);
  font-style: normal;
}

.logo-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--ink-dim);
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
}

.cv-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 5px 12px;
  background: var(--ink);
  color: var(--bg);
  border-radius: 4px;
  letter-spacing: 1px;
}

/* Upload */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 16px;
  background: var(--surface);
  padding: 56px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}

.upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: #fff9f7; }

.upload-zone .icon { font-size: 52px; display: block; margin-bottom: 16px; }
.upload-zone h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
.upload-zone p {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 24px;
}

.btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 11px 22px;
  border-radius: 8px;
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
}

.btn-fill { background: var(--ink); color: var(--bg); }
.btn-fill:hover { background: var(--accent); transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--ink); border: 2px solid var(--border); }
.btn-outline:hover { border-color: var(--ink); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { opacity: 0.85; }
.btn-sm { padding: 7px 14px; font-size: 12px; }

/* Tips */
.tips {
  margin-top: 20px;
  background: var(--surface2);
  border-radius: 12px;
  padding: 18px 22px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
}

.tip {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-dim);
}

.tip .ti { font-size: 16px; flex-shrink: 0; }

/* Params panel */
.params-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 24px;
  margin-bottom: 20px;
  display: none;
}

.params-panel.show { display: block; }

.params-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--ink-dim);
  margin-bottom: 16px;
}

.params-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}

.param-item label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-dim);
  margin-bottom: 6px;
  font-family: 'IBM Plex Mono', monospace;
}

.param-item input[type=range] {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
}

.param-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  margin-left: 8px;
}

/* Workspace */
.workspace { display: none; }
.workspace.show { display: block; }

.canvas-area {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.canvas-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface2);
}

.canvas-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--ink-dim);
}

.tabs {
  display: flex;
  gap: 4px;
  background: var(--bg);
  padding: 4px;
  border-radius: 8px;
}

.tab {
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 5px;
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  border: none;
  background: transparent;
  color: var(--ink-dim);
  transition: all 0.15s;
}

.tab.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

.canvas-body {
  padding: 16px;
  background: #1a1a18;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 280px;
  position: relative;
}

#srcCanvas, #dstCanvas { 
  max-width: 100%;
  max-height: 480px;
  border-radius: 8px;
  display: block;
}

#dstCanvas { display: none; }

/* Result */
.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

@media (max-width: 600px) { .result-grid { grid-template-columns: 1fr; } }

.result-main {
  background: var(--ink);
  color: var(--bg);
  border-radius: 16px;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.result-main::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.12;
}

.count-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  opacity: 0.5;
  margin-bottom: 8px;
}

.count-num {
  font-size: 80px;
  font-weight: 800;
  line-height: 1;
  color: #fff;
  letter-spacing: -3px;
}

.count-unit {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  opacity: 0.5;
  margin-top: 4px;
}

.stats-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.stat-row:last-child { border-bottom: none; padding-bottom: 0; }

.stat-key {
  font-size: 12px;
  color: var(--ink-dim);
  font-family: 'IBM Plex Mono', monospace;
}

.stat-val {
  font-size: 16px;
  font-weight: 700;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--ink);
}

.stat-val.ok { color: var(--accent3); }
.stat-val.warn { color: var(--accent); }

/* Manual adjust */
.adjust-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.adjust-label {
  font-size: 12px;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--ink-dim);
  flex: 1;
}

.adj-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 2px solid var(--border);
  background: var(--surface2);
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  font-family: monospace;
}

.adj-btn:hover { border-color: var(--ink); background: var(--ink); color: var(--bg); }

.adj-input {
  width: 80px;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 20px; font-weight: 700;
  color: var(--ink);
  text-align: center;
  outline: none;
}

.adj-input:focus { border-color: var(--accent); }

/* Action bar */
.action-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }

/* Progress */
.progress-wrap {
  position: fixed;
  inset: 0;
  background: rgba(245,242,235,0.92);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 100;
  backdrop-filter: blur(6px);
}

.progress-wrap.show { display: flex; }

.progress-title {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.progress-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--ink-dim);
}

.progress-bar-wrap {
  width: 280px;
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  width: 0%;
  transition: width 0.3s ease;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--ink);
  color: var(--bg);
  padding: 12px 22px;
  border-radius: 10px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  z-index: 200;
  transition: transform 0.3s;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* History */
.history-section { margin-top: 8px; }

.section-head {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--ink-dim);
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}

.hist-list { display: flex; flex-direction: column; gap: 8px; }

.hist-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: border-color 0.2s;
}

.hist-item:hover { border-color: var(--ink-dim); }

.hist-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  min-width: 48px;
}

.hist-meta { flex: 1; }
.hist-time { font-size: 11px; color: var(--ink-dim); font-family: 'IBM Plex Mono', monospace; }

.empty-msg {
  text-align: center;
  color: var(--ink-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 24px;
}

input[type=file] { display: none; }
</style>
</head>
<body>

<div class="progress-wrap" id="progress">
  <div class="progress-title">解析中...</div>
  <div class="progress-sub" id="progressSub">画像を前処理しています</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="toast" id="toast"></div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-name">Pill<em>Count</em></div>
      <div class="logo-tag">VISION</div>
    </div>
    <div class="cv-badge">OpenCV.js</div>
  </header>

  <!-- Upload -->
  <div id="uploadSection">
    <div class="upload-zone" id="zone">
      <span class="icon">🔬</span>
      <h2>錠剤画像を読み込む</h2>
      <p>OpenCV.js による完全ローカル処理 / APIなし</p>
      <div class="btn-row">
        <button class="btn btn-fill" onclick="document.getElementById('fi').click()">🖼️ 画像を選択</button>
        <button class="btn btn-outline" onclick="document.getElementById('ci').click()">📷 カメラで撮影</button>
      </div>
    </div>
    <input type="file" id="fi" accept="image/*" onchange="loadImage(this.files[0])">
    <input type="file" id="ci" accept="image/*" capture="environment" onchange="loadImage(this.files[0])">

    <div class="tips">
      <div class="tip"><span class="ti">☀️</span><span>明るく均一な照明</span></div>
      <div class="tip"><span class="ti">⬜</span><span>白・単色の背景</span></div>
      <div class="tip"><span class="ti">📐</span><span>1層に広げて重ならないように</span></div>
      <div class="tip"><span class="ti">📸</span><span>真上から俯瞰撮影</span></div>
    </div>
  </div>

  <!-- Params -->
  <div class="params-panel" id="paramsPanel">
    <div class="params-title">// 検出パラメータ</div>
    <div class="params-grid">
      <div class="param-item">
        <label>最小サイズ (px) <span class="param-val" id="vMinR">8</span></label>
        <input type="range" id="pMinR" min="3" max="60" value="8" oninput="updateParam('vMinR',this.value); reanalyze()">
      </div>
      <div class="param-item">
        <label>最大サイズ (px) <span class="param-val" id="vMaxR">120</span></label>
        <input type="range" id="pMaxR" min="20" max="400" value="120" oninput="updateParam('vMaxR',this.value); reanalyze()">
      </div>
      <div class="param-item">
        <label>閾値 (Threshold) <span class="param-val" id="vThresh">128</span></label>
        <input type="range" id="pThresh" min="50" max="220" value="128" oninput="updateParam('vThresh',this.value); reanalyze()">
      </div>
      <div class="param-item">
        <label>円形度フィルタ <span class="param-val" id="vCirc">0.50</span></label>
        <input type="range" id="pCirc" min="0" max="90" value="50" oninput="updateParam('vCirc',(this.value/100).toFixed(2)); reanalyze()">
      </div>
    </div>
  </div>

  <!-- Workspace -->
  <div class="workspace" id="workspace">
    <div class="canvas-area">
      <div class="canvas-header">
        <span class="canvas-title">// IMAGE VIEWER</span>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="tabs">
            <button class="tab active" id="tabOrig" onclick="switchTab('orig')">元画像</button>
            <button class="tab" id="tabProc" onclick="switchTab('proc')">処理後</button>
          </div>
          <button class="btn btn-outline btn-sm" onclick="resetApp()">✕ リセット</button>
        </div>
      </div>
      <div class="canvas-body">
        <canvas id="srcCanvas"></canvas>
        <canvas id="dstCanvas"></canvas>
      </div>
    </div>

    <div class="result-grid">
      <div class="result-main">
        <div class="count-label">DETECTED PILLS</div>
        <div class="count-num" id="countNum">—</div>
        <div class="count-unit">錠</div>
      </div>
      <div class="stats-panel">
        <div class="stat-row">
          <span class="stat-key">検出数</span>
          <span class="stat-val" id="sDetected">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">平均面積</span>
          <span class="stat-val" id="sArea">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">処理時間</span>
          <span class="stat-val" id="sTime">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">手法</span>
          <span class="stat-val" id="sMethod">—</span>
        </div>
      </div>
    </div>

    <div class="adjust-bar">
      <span class="adjust-label">手動補正</span>
      <div class="adj-btn" onclick="adj(-10)">−10</div>
      <div class="adj-btn" onclick="adj(-1)">−</div>
      <input type="number" class="adj-input" id="adjInput" min="0" max="9999" oninput="adjSet(this.value)">
      <div class="adj-btn" onclick="adj(+1)">＋</div>
      <div class="adj-btn" onclick="adj(+10)">＋10</div>
    </div>

    <div class="action-bar">
      <button class="btn btn-fill" onclick="saveHist()">💾 保存</button>
      <button class="btn btn-outline" onclick="copyRes()">📋 コピー</button>
      <button class="btn btn-outline" onclick="document.getElementById('fi').click()">🔄 別の画像</button>
      <button class="btn btn-outline" onclick="exportResult()">📥 画像を保存</button>
    </div>
  </div>

  <!-- History -->
  <div class="history-section">
    <div class="section-head">// HISTORY</div>
    <div class="hist-list" id="histList"><div class="empty-msg">まだ記録がありません</div></div>
  </div>
</div>

<script>
let cvReady = false;
let currentCount = 0;
let origImageData = null;
let history = JSON.parse(localStorage.getItem('pcv_hist') || '[]');
let reanalyzeTimer = null;

window.onOpenCvReady = () => { cvReady = true; };

// Drag & drop
const zone = document.getElementById('zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); if(e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]); });

function updateParam(id, val) {
  document.getElementById(id).textContent = val;
}

function loadImage(file) {
  if (!file || !file.type.startsWith('image/')) { showToast('画像ファイルを選択してください'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      origImageData = img;
      document.getElementById('uploadSection').style.display = 'none';
      document.getElementById('paramsPanel').classList.add('show');
      document.getElementById('workspace').classList.add('show');
      drawOriginal(img);
      analyze(img);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function drawOriginal(img) {
  const canvas = document.getElementById('srcCanvas');
  const maxW = Math.min(800, window.innerWidth - 64);
  const scale = Math.min(1, maxW / img.width, 480 / img.height);
  canvas.width = img.width * scale;
  canvas.height = img.height * scale;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

function reanalyze() {
  if (!origImageData) return;
  clearTimeout(reanalyzeTimer);
  reanalyzeTimer = setTimeout(() => analyze(origImageData), 400);
}

async function analyze(img) {
  if (!cvReady) { showToast('OpenCV読み込み中... 少し待ってください'); setTimeout(() => analyze(img), 1000); return; }

  setProgress(true, '画像を前処理しています', 10);

  await sleep(30);

  const t0 = performance.now();
  const params = getParams();

  // Draw to offscreen canvas
  const oc = document.createElement('canvas');
  const maxW = Math.min(1200, img.width);
  const scale = Math.min(1, maxW / img.width);
  oc.width = img.width * scale;
  oc.height = img.height * scale;
  oc.getContext('2d').drawImage(img, 0, 0, oc.width, oc.height);

  setProgress(true, 'グレースケール変換', 25);
  await sleep(20);

  let src = cv.imread(oc);
  let gray = new cv.Mat();
  let blur = new cv.Mat();
  let thresh = new cv.Mat();

  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

  setProgress(true, 'ノイズ除去・二値化', 45);
  await sleep(20);

  // Gaussian blur
  const ksize = new cv.Size(5, 5);
  cv.GaussianBlur(gray, blur, ksize, 0);

  // Adaptive threshold for better results
  cv.adaptiveThreshold(blur, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 21, params.thresh / 20);

  setProgress(true, '輪郭検出中', 65);
  await sleep(20);

  // Morphological operations
  let kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(3, 3));
  let morphed = new cv.Mat();
  cv.morphologyEx(thresh, morphed, cv.MORPH_CLOSE, kernel);
  cv.morphologyEx(morphed, morphed, cv.MORPH_OPEN, kernel);

  // Find contours
  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();
  cv.findContours(morphed, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  setProgress(true, '錠剤をフィルタリング', 80);
  await sleep(20);

  const minArea = Math.PI * params.minR * params.minR;
  const maxArea = Math.PI * params.maxR * params.maxR;
  const minCirc = params.circ;

  let valid = [];
  let totalArea = 0;

  for (let i = 0; i < contours.size(); i++) {
    const cnt = contours.get(i);
    const area = cv.contourArea(cnt);
    if (area < minArea || area > maxArea) continue;

    const perimeter = cv.arcLength(cnt, true);
    const circularity = perimeter > 0 ? (4 * Math.PI * area) / (perimeter * perimeter) : 0;
    if (circularity < minCirc) continue;

    const rect = cv.boundingRect(cnt);
    const cx = rect.x + rect.width / 2;
    const cy = rect.y + rect.height / 2;
    valid.push({ cx, cy, area, circularity, cnt: i });
    totalArea += area;
  }

  setProgress(true, '結果を描画中', 92);
  await sleep(20);

  const t1 = performance.now();
  const elapsed = ((t1 - t0) / 1000).toFixed(2);

  // Draw result on dst canvas
  const dstCanvas = document.getElementById('dstCanvas');
  dstCanvas.width = oc.width;
  dstCanvas.height = oc.height;
  const dctx = dstCanvas.getContext('2d');
  dctx.drawImage(oc, 0, 0);

  // Draw detected pills
  valid.forEach((p, idx) => {
    const cnt = contours.get(p.cnt);
    const rect = cv.boundingRect(cnt);
    const rx = rect.width / 2;
    const ry = rect.height / 2;
    const r = Math.max(rx, ry) * 1.05;

    // Circle overlay
    dctx.beginPath();
    dctx.arc(p.cx, p.cy, r, 0, Math.PI * 2);
    dctx.strokeStyle = '#e85d26';
    dctx.lineWidth = Math.max(1.5, oc.width / 600);
    dctx.stroke();
    dctx.fillStyle = 'rgba(232,93,38,0.15)';
    dctx.fill();

    // Number label
    if (valid.length <= 200) {
      const fs = Math.max(8, Math.min(r * 0.7, 18));
      dctx.font = `bold ${fs}px IBM Plex Mono, monospace`;
      dctx.fillStyle = '#e85d26';
      dctx.textAlign = 'center';
      dctx.textBaseline = 'middle';
      dctx.fillText(idx + 1, p.cx, p.cy);
    }
  });

  // Count badge
  dctx.fillStyle = '#1a1a18';
  dctx.roundRect(8, 8, 160, 40, 8);
  dctx.fill();
  dctx.font = `bold 16px IBM Plex Mono, monospace`;
  dctx.fillStyle = '#f5f2eb';
  dctx.textAlign = 'left';
  dctx.textBaseline = 'middle';
  dctx.fillText(`COUNT: ${valid.length}`, 16, 28);

  // Cleanup
  src.delete(); gray.delete(); blur.delete(); thresh.delete();
  morphed.delete(); kernel.delete(); contours.delete(); hierarchy.delete();

  setProgress(false);

  currentCount = valid.length;
  displayResult(valid.length, totalArea, elapsed, valid.length > 150 ? 'estimate' : 'contour');

  showToast(`${valid.length}錠を検出しました`);
}

function getParams() {
  return {
    minR: parseFloat(document.getElementById('pMinR').value),
    maxR: parseFloat(document.getElementById('pMaxR').value),
    thresh: parseFloat(document.getElementById('pThresh').value),
    circ: parseFloat(document.getElementById('pCirc').value) / 100,
  };
}

function displayResult(count, totalArea, elapsed, method) {
  // Animate
  const el = document.getElementById('countNum');
  let v = 0;
  const step = Math.max(1, Math.ceil(count / 40));
  const t = setInterval(() => {
    v = Math.min(v + step, count);
    el.textContent = v;
    if (v >= count) clearInterval(t);
  }, 20);

  document.getElementById('sDetected').textContent = count;
  document.getElementById('sArea').textContent = count > 0 ? Math.round(totalArea / count) + ' px²' : '—';
  document.getElementById('sTime').textContent = elapsed + 's';
  document.getElementById('sMethod').textContent = method.toUpperCase();
  document.getElementById('adjInput').value = count;
}

function switchTab(tab) {
  const src = document.getElementById('srcCanvas');
  const dst = document.getElementById('dstCanvas');
  document.getElementById('tabOrig').classList.toggle('active', tab === 'orig');
  document.getElementById('tabProc').classList.toggle('active', tab === 'proc');
  src.style.display = tab === 'orig' ? 'block' : 'none';
  dst.style.display = tab === 'proc' ? 'block' : 'none';
}

function adj(d) {
  currentCount = Math.max(0, Math.min(9999, currentCount + d));
  document.getElementById('adjInput').value = currentCount;
  document.getElementById('countNum').textContent = currentCount;
  document.getElementById('sDetected').textContent = currentCount;
}

function adjSet(v) {
  const n = parseInt(v);
  if (!isNaN(n) && n >= 0) {
    currentCount = n;
    document.getElementById('countNum').textContent = n;
    document.getElementById('sDetected').textContent = n;
  }
}

function saveHist() {
  history.unshift({ count: currentCount, time: new Date().toLocaleString('ja-JP'), id: Date.now() });
  if (history.length > 30) history.pop();
  localStorage.setItem('pcv_hist', JSON.stringify(history));
  renderHistory();
  showToast('保存しました');
}

function copyRes() {
  navigator.clipboard.writeText(`錠剤カウント: ${currentCount}錠 (${new Date().toLocaleString('ja-JP')})`).then(() => showToast('コピーしました'));
}

function exportResult() {
  const canvas = document.getElementById('dstCanvas');
  const link = document.createElement('a');
  link.download = `pillcount_${currentCount}.png`;
  link.href = canvas.toDataURL();
  link.click();
  showToast('画像を保存しました');
}

function resetApp() {
  document.getElementById('uploadSection').style.display = 'block';
  document.getElementById('paramsPanel').classList.remove('show');
  document.getElementById('workspace').classList.remove('show');
  document.getElementById('fi').value = '';
  origImageData = null; currentCount = 0;
  switchTab('orig');
}

function setProgress(show, msg, pct) {
  const el = document.getElementById('progress');
  el.classList.toggle('show', show);
  if (msg) document.getElementById('progressSub').textContent = msg;
  if (pct !== undefined) document.getElementById('progressBar').style.width = pct + '%';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function renderHistory() {
  const list = document.getElementById('histList');
  if (!history.length) { list.innerHTML = '<div class="empty-msg">まだ記録がありません</div>'; return; }
  list.innerHTML = history.map(h => `
    <div class="hist-item">
      <span class="hist-count">${h.count}</span>
      <div class="hist-meta">
        <div style="font-weight:700;font-size:14px">${h.count} 錠</div>
        <div class="hist-time">${h.time}</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="delHist(${h.id})">削除</button>
    </div>
  `).join('');
}

function delHist(id) {
  history = history.filter(h => h.id !== id);
  localStorage.setItem('pcv_hist', JSON.stringify(history));
  renderHistory();
}

renderHistory();
</script>
