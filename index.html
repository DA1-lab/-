<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>錠剤カウンター Lite</title>
<style>
body{margin:0;background:#111;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#222;padding:18px 16px;position:sticky;top:0;z-index:10}
h1{margin:0 0 10px;font-size:24px}
#count{color:#ff3b30;font-size:50px;font-weight:900}
main{padding:12px}
button,input[type=file]{font-size:16px;margin:6px 4px 6px 0}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.primary{background:#0a84ff;color:white}.warn{background:#ff9500;color:black}.gray{background:#444;color:white}
.panel{background:#1d1d1f;border-radius:14px;padding:14px;margin:12px 0}
.row{margin:12px 0}
label{display:flex;justify-content:space-between;color:#ddd;font-size:15px}
input[type=range]{width:100%}
canvas{width:100%;border-radius:14px;background:#000;touch-action:none}
.preview{height:120px;display:flex;align-items:center;justify-content:center;background:#111;border-radius:12px;margin-top:8px}
.small{color:#aaa;font-size:13px;line-height:1.6}
</style>
</head>

<body>
<header>
  <h1>錠剤カウンター Lite</h1>
  <div>検出数：<span id="count">0</span></div>
</header>

<main>
  <input id="file" type="file" accept="image/*" capture="environment">
  <br>
  <button class="primary" onclick="autoDetect()">自動カウント</button>
  <button class="gray" onclick="detect()">再検出</button>
  <button class="warn" onclick="resetManual()">手動修正リセット</button>

  <div class="panel">
    <div class="row">
      <label>検出感度 <span id="vSensitivity"></span></label>
      <input id="sensitivity" type="range" min="10" max="100" value="55">
    </div>

    <div class="row">
      <label>最小半径 <span id="vMinR"></span></label>
      <input id="minR" type="range" min="3" max="60" value="9">
    </div>

    <div class="row">
      <label>最大半径 <span id="vMaxR"></span></label>
      <input id="maxR" type="range" min="5" max="90" value="28">
    </div>

    <div class="preview">
      <canvas id="radiusPreview" width="260" height="110"></canvas>
    </div>

    <div class="row">
      <label>錠剤同士の最小距離 <span id="vMinDist"></span></label>
      <input id="minDist" type="range" min="4" max="80" value="22">
    </div>

    <div class="row">
      <label>白さ判定 <span id="vWhite"></span></label>
      <input id="white" type="range" min="80" max="250" value="145">
    </div>

    <div class="row">
      <label>輪郭の太さ <span id="vLine"></span></label>
      <input id="line" type="range" min="2" max="10" value="4">
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div class="panel small">
    ・画像は自動で小さくして処理するので前より軽いです。<br>
    ・赤丸をタップ → 除外<br>
    ・見逃し錠剤をタップ → 追加<br>
    ・バー操作後、少し待ってから再検出します。
  </div>
</main>

<script async src="https://docs.opencv.org/4.x/opencv.js" onload="cvReady=true"></script>

<script>
let cvReady = false;

const fileInput = document.getElementById("file");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const workCanvas = document.createElement("canvas");
const workCtx = workCanvas.getContext("2d");

const preview = document.getElementById("radiusPreview");
const pctx = preview.getContext("2d");

let img = new Image();
let circles = [];
let removed = new Set();
let added = [];
let detectTimer = null;

const $ = id => document.getElementById(id);

["sensitivity","minR","maxR","minDist","white","line"].forEach(id=>{
  $(id).addEventListener("input",()=>{
    updateLabels();
    drawRadiusPreview();
    clearTimeout(detectTimer);
    detectTimer = setTimeout(()=>detect(), 350);
  });
});

fileInput.addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    prepareImage();
    autoDetect();
  };
  img.src = url;
});

function prepareImage(){
  const maxW = 1000;
  const scale = Math.min(1, maxW / img.width);

  workCanvas.width = Math.round(img.width * scale);
  workCanvas.height = Math.round(img.height * scale);

  canvas.width = workCanvas.width;
  canvas.height = workCanvas.height;

  workCtx.drawImage(img,0,0,workCanvas.width,workCanvas.height);
  drawBase();
}

function drawBase(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(workCanvas,0,0);
}

function autoDetect(){
  if(!cvReady){
    alert("画像処理エンジンを読み込み中です。数秒後にもう一度押してください。");
    return;
  }
  if(!workCanvas.width){
    alert("先に写真を選んでください。");
    return;
  }

  autoSetParams();
  removed.clear();
  added = [];
  detect();
}

function autoSetParams(){
  const shortSide = Math.min(workCanvas.width, workCanvas.height);

  $("minR").value = Math.max(5, Math.round(shortSide / 110));
  $("maxR").value = Math.max(14, Math.round(shortSide / 32));
  $("minDist").value = Math.max(10, Math.round(shortSide / 50));
  $("sensitivity").value = 57;
  $("white").value = 145;
  $("line").value = 4;

  updateLabels();
  drawRadiusPreview();
}

function detect(){
  if(!cvReady || !workCanvas.width) return;

  const src = cv.imread(workCanvas);
  const gray = new cv.Mat();
  const blur = new cv.Mat();
  const circlesMat = new cv.Mat();

  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray, blur, new cv.Size(3,3), 0);

  const minDist = Number($("minDist").value);
  const minR = Number($("minR").value);
  const maxR = Number($("maxR").value);
  const sensitivity = Number($("sensitivity").value);

  const param1 = 80;
  const param2 = Math.max(8, 72 - sensitivity);

  cv.HoughCircles(
    blur,
    circlesMat,
    cv.HOUGH_GRADIENT,
    1.2,
    minDist,
    param1,
    param2,
    minR,
    maxR
  );

  circles = [];

  for(let i=0;i<circlesMat.cols;i++){
    const x = circlesMat.data32F[i*3];
    const y = circlesMat.data32F[i*3+1];
    const r = circlesMat.data32F[i*3+2];

    if(isWhiteEnough(gray,x,y,r)){
      circles.push({x,y,r});
    }
  }

  circles = removeDuplicates(circles);

  src.delete();
  gray.delete();
  blur.delete();
  circlesMat.delete();

  removed.clear();
  draw();
}

function isWhiteEnough(gray,x,y,r){
  const whiteThreshold = Number($("white").value);
  let sum = 0;
  let count = 0;

  const step = Math.max(3, Math.round(r / 3));

  for(let dy=-r*0.5; dy<=r*0.5; dy+=step){
    for(let dx=-r*0.5; dx<=r*0.5; dx+=step){
      if(dx*dx + dy*dy > r*r*0.25) continue;

      const px = Math.round(x + dx);
      const py = Math.round(y + dy);

      if(px < 0 || py < 0 || px >= gray.cols || py >= gray.rows) continue;

      sum += gray.ucharPtr(py,px)[0];
      count++;
    }
  }

  if(count === 0) return false;
  return sum / count >= whiteThreshold;
}

function removeDuplicates(list){
  const result = [];
  list.sort((a,b)=>b.r-a.r);

  for(const c of list){
    let duplicate = false;
    for(const d of result){
      const dist = Math.hypot(c.x-d.x,c.y-d.y);
      if(dist < Math.min(c.r,d.r) * 0.7){
        duplicate = true;
        break;
      }
    }
    if(!duplicate) result.push(c);
  }
  return result;
}

function draw(){
  drawBase();

  const line = Number($("line").value);
  ctx.lineWidth = line;
  ctx.font = "bold 17px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  let n = 0;

  circles.forEach((c,i)=>{
    if(removed.has(i)) return;
    n++;

    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r+2,0,Math.PI*2);
    ctx.strokeStyle = "#ff3b30";
    ctx.stroke();

    ctx.fillStyle = "#ff3b30";
    ctx.fillText(n,c.x,c.y);
  });

  added.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.strokeStyle = "#34c759";
    ctx.stroke();

    ctx.fillStyle = "#34c759";
    ctx.fillText("+",p.x,p.y);
  });

  $("count").textContent = n + added.length;
}

canvas.addEventListener("pointerdown", e=>{
  if(!workCanvas.width) return;

  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * canvas.width / rect.width;
  const y = (e.clientY - rect.top) * canvas.height / rect.height;

  let hit = -1;
  let best = Infinity;

  circles.forEach((c,i)=>{
    if(removed.has(i)) return;

    const d = Math.hypot(x-c.x,y-c.y);
    if(d < c.r + 18 && d < best){
      best = d;
      hit = i;
    }
  });

  if(hit >= 0){
    removed.add(hit);
  }else{
    added.push({x,y,r:Number($("maxR").value) * 0.65});
  }

  draw();
});

function resetManual(){
  removed.clear();
  added = [];
  draw();
}

function updateLabels(){
  $("vSensitivity").textContent = $("sensitivity").value;
  $("vMinR").textContent = $("minR").value;
  $("vMaxR").textContent = $("maxR").value;
  $("vMinDist").textContent = $("minDist").value;
  $("vWhite").textContent = $("white").value;
  $("vLine").textContent = $("line").value;
}

function drawRadiusPreview(){
  const minR = Number($("minR").value);
  const maxR = Number($("maxR").value);

  pctx.clearRect(0,0,preview.width,preview.height);
  pctx.fillStyle = "#111";
  pctx.fillRect(0,0,preview.width,preview.height);

  pctx.lineWidth = 3;

  pctx.strokeStyle = "#34c759";
  pctx.beginPath();
  pctx.arc(80,55,minR,0,Math.PI*2);
  pctx.stroke();

  pctx.fillStyle = "#34c759";
  pctx.font = "14px sans-serif";
  pctx.textAlign = "center";
  pctx.fillText("最小",80,100);

  pctx.strokeStyle = "#ff3b30";
  pctx.beginPath();
  pctx.arc(180,55,maxR,0,Math.PI*2);
  pctx.stroke();

  pctx.fillStyle = "#ff3b30";
  pctx.fillText("最大",180,100);
}

updateLabels();
drawRadiusPreview();
</script>
</body>
</html>
