<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>じゃが島風タンク - iPhone版プロトタイプ</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #162416;
    }

    #hud {
      position: fixed;
      top: env(safe-area-inset-top, 10px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,.6);
      pointer-events: none;
      z-index: 5;
    }

    #message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: clamp(22px, 5vw, 48px);
      font-weight: 800;
      text-align: center;
      text-shadow: 0 3px 8px rgba(0,0,0,.8);
      pointer-events: none;
      z-index: 6;
    }

    #fireButton {
      position: fixed;
      right: calc(24px + env(safe-area-inset-right, 0px));
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.75);
      background: rgba(200, 40, 35, .78);
      color: white;
      font-size: 18px;
      font-weight: 800;
      z-index: 10;
      box-shadow: 0 8px 20px rgba(0,0,0,.45), inset 0 0 18px rgba(255,255,255,.18);
      touch-action: none;
    }

    #fireButton:active {
      transform: scale(.96);
      background: rgba(255, 55, 45, .9);
    }

    #help {
      position: fixed;
      left: 50%;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      color: rgba(255,255,255,.72);
      font-size: 12px;
      text-align: center;
      pointer-events: none;
      z-index: 4;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div>HP: <span id="hp">100</span></div>
    <div>敵: <span id="enemies">0</span> / SCORE: <span id="score">0</span></div>
  </div>
  <div id="message"></div>
  <button id="fireButton">発射</button>
  <div id="help">左下をドラッグ: 移動 ／ 右側をドラッグ: 照準 ／ 発射ボタン: 砲撃</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hpEl = document.getElementById('hp');
  const enemiesEl = document.getElementById('enemies');
  const scoreEl = document.getElementById('score');
  const messageEl = document.getElementById('message');
  const fireButton = document.getElementById('fireButton');

  let W = 0;
  let H = 0;
  let dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const world = { w: 2200, h: 1400 };

  const player = {
    x: world.w / 2,
    y: world.h / 2,
    r: 20,
    bodyAngle: 0,
    turretAngle: 0,
    speed: 0,
    hp: 100,
    fireCooldown: 0,
    inv: 0
  };

  let score = 0;
  let gameOver = false;

  const input = {
    moveId: null,
    aimId: null,
    moveBase: { x: 95, y: H - 95 },
    moveStick: { x: 95, y: H - 95 },
    moveVec: { x: 0, y: 0 },
    aimPoint: null
  };

  const bullets = [];
  const particles = [];
  const enemies = [];
  const obstacles = [
    { x: 320, y: 260, w: 210, h: 80 },
    { x: 820, y: 220, w: 90, h: 260 },
    { x: 1260, y: 320, w: 310, h: 90 },
    { x: 1680, y: 260, w: 130, h: 280 },
    { x: 420, y: 760, w: 260, h: 110 },
    { x: 1000, y: 680, w: 120, h: 260 },
    { x: 1510, y: 820, w: 360, h: 100 },
    { x: 720, y: 1120, w: 320, h: 90 },
    { x: 1320, y: 1120, w: 180, h: 150 }
  ];

  function spawnEnemies() {
    enemies.length = 0;
    for (let i = 0; i < 8; i++) {
      enemies.push({
        x: 180 + Math.random() * (world.w - 360),
        y: 150 + Math.random() * (world.h - 300),
        r: 18,
        hp: 35,
        angle: Math.random() * Math.PI * 2,
        turretAngle: 0,
        cooldown: Math.random() * 2,
        wander: Math.random() * 10
      });
    }
  }
  spawnEnemies();

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function dist(a, b, c, d) { return Math.hypot(a - c, b - d); }
  function angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }
  function lerpAngle(a, b, t) {
    let d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    return a + d * t;
  }

  function rectCircleCollide(rect, cx, cy, cr) {
    const nx = clamp(cx, rect.x, rect.x + rect.w);
    const ny = clamp(cy, rect.y, rect.y + rect.h);
    return Math.hypot(cx - nx, cy - ny) < cr;
  }

  function blocked(x, y, r) {
    if (x < r || y < r || x > world.w - r || y > world.h - r) return true;
    return obstacles.some(o => rectCircleCollide(o, x, y, r));
  }

  function moveEntity(e, vx, vy) {
    const nx = e.x + vx;
    if (!blocked(nx, e.y, e.r)) e.x = nx;
    const ny = e.y + vy;
    if (!blocked(e.x, ny, e.r)) e.y = ny;
  }

  function getCamera() {
    return {
      x: clamp(player.x - W / 2, 0, Math.max(0, world.w - W)),
      y: clamp(player.y - H / 2, 0, Math.max(0, world.h - H))
    };
  }

  function screenToWorld(sx, sy) {
    const cam = getCamera();
    return { x: sx + cam.x, y: sy + cam.y };
  }

  function fire(owner, x, y, angle, isEnemy = false) {
    const speed = isEnemy ? 6.2 : 8.4;
    bullets.push({
      x: x + Math.cos(angle) * 28,
      y: y + Math.sin(angle) * 28,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 95,
      r: isEnemy ? 4 : 5,
      enemy: isEnemy,
      owner
    });
  }

  fireButton.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!gameOver && player.fireCooldown <= 0) {
      fire(player, player.x, player.y, player.turretAngle, false);
      player.fireCooldown = 0.34;
    }
  });

  canvas.addEventListener('pointerdown', e => {
    if (gameOver) {
      reset();
      return;
    }
    canvas.setPointerCapture(e.pointerId);
    const x = e.clientX;
    const y = e.clientY;

    if (x < W * 0.43 && y > H * 0.40 && input.moveId === null) {
      input.moveId = e.pointerId;
      input.moveBase = { x, y };
      input.moveStick = { x, y };
    } else if (input.aimId === null) {
      input.aimId = e.pointerId;
      input.aimPoint = { x, y };
      const p = screenToWorld(x, y);
      player.turretAngle = angleTo(player.x, player.y, p.x, p.y);
    }
  });

  canvas.addEventListener('pointermove', e => {
    const x = e.clientX;
    const y = e.clientY;

    if (e.pointerId === input.moveId) {
      const dx = x - input.moveBase.x;
      const dy = y - input.moveBase.y;
      const len = Math.hypot(dx, dy);
      const max = 58;
      const k = len > max ? max / len : 1;
      input.moveStick = { x: input.moveBase.x + dx * k, y: input.moveBase.y + dy * k };
      input.moveVec = { x: (dx * k) / max, y: (dy * k) / max };
    }

    if (e.pointerId === input.aimId) {
      input.aimPoint = { x, y };
      const p = screenToWorld(x, y);
      player.turretAngle = angleTo(player.x, player.y, p.x, p.y);
    }
  });

  function endPointer(e) {
    if (e.pointerId === input.moveId) {
      input.moveId = null;
      input.moveVec = { x: 0, y: 0 };
      input.moveStick = { ...input.moveBase };
    }
    if (e.pointerId === input.aimId) {
      input.aimId = null;
      input.aimPoint = null;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  function explosion(x, y, count = 16) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1.5 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 22 + Math.random() * 18,
        r: 2 + Math.random() * 4
      });
    }
  }

  function update(dt) {
    if (gameOver) return;

    player.fireCooldown -= dt;
    player.inv = Math.max(0, player.inv - dt);

    const mv = input.moveVec;
    const mag = Math.hypot(mv.x, mv.y);
    if (mag > 0.08) {
      const speed = 230 * dt * clamp(mag, 0, 1);
      const a = Math.atan2(mv.y, mv.x);
      player.bodyAngle = lerpAngle(player.bodyAngle, a, 0.18);
      moveEntity(player, Math.cos(a) * speed, Math.sin(a) * speed);
    }

    for (const e of enemies) {
      if (e.hp <= 0) continue;
      const d = dist(e.x, e.y, player.x, player.y);
      e.turretAngle = lerpAngle(e.turretAngle, angleTo(e.x, e.y, player.x, player.y), 0.045);
      e.cooldown -= dt;
      e.wander -= dt;

      let targetAngle;
      if (d < 520) {
        targetAngle = angleTo(e.x, e.y, player.x, player.y) + Math.PI;
      } else {
        if (e.wander <= 0) {
          e.angle += -1 + Math.random() * 2;
          e.wander = 1.0 + Math.random() * 2.0;
        }
        targetAngle = e.angle;
      }
      e.angle = lerpAngle(e.angle, targetAngle, 0.025);
      moveEntity(e, Math.cos(e.angle) * 65 * dt, Math.sin(e.angle) * 65 * dt);

      if (d < 650 && e.cooldown <= 0) {
        fire(e, e.x, e.y, e.turretAngle + (-0.08 + Math.random() * 0.16), true);
        e.cooldown = 1.1 + Math.random() * 1.1;
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      b.life--;

      let hit = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > world.w || b.y > world.h || obstacles.some(o => rectCircleCollide(o, b.x, b.y, b.r));

      if (!hit && b.enemy && player.inv <= 0 && dist(b.x, b.y, player.x, player.y) < player.r + b.r) {
        player.hp -= 9;
        player.inv = 0.25;
        explosion(b.x, b.y, 8);
        hit = true;
        if (player.hp <= 0) {
          player.hp = 0;
          gameOver = true;
          messageEl.innerHTML = '撃破された<br><span style="font-size:40%">画面をタップで再開</span>';
          explosion(player.x, player.y, 42);
        }
      }

      if (!hit && !b.enemy) {
        for (const e of enemies) {
          if (e.hp > 0 && dist(b.x, b.y, e.x, e.y) < e.r + b.r) {
            e.hp -= 18;
            explosion(b.x, b.y, 8);
            hit = true;
            if (e.hp <= 0) {
              score += 100;
              explosion(e.x, e.y, 28);
            }
            break;
          }
        }
      }

      if (hit) bullets.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (enemies.every(e => e.hp <= 0)) {
      spawnEnemies();
      player.hp = Math.min(100, player.hp + 25);
      messageEl.textContent = '敵部隊追加';
      setTimeout(() => { if (!gameOver) messageEl.textContent = ''; }, 900);
    }

    hpEl.textContent = Math.ceil(player.hp);
    enemiesEl.textContent = enemies.filter(e => e.hp > 0).length;
    scoreEl.textContent = score;
  }

  function drawTank(x, y, bodyAngle, turretAngle, color, hpRatio = 1, isPlayer = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(bodyAngle);

    ctx.fillStyle = 'rgba(0,0,0,.32)';
    ctx.beginPath();
    ctx.ellipse(3, 5, 27, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#222';
    ctx.fillRect(-22, -17, 44, 10);
    ctx.fillRect(-22, 7, 44, 10);

    ctx.fillStyle = color;
    roundRect(-20, -14, 40, 28, 7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(turretAngle);
    ctx.fillStyle = '#222';
    roundRect(0, -5, 34, 10, 4);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    if (!isPlayer) {
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(x - 20, y - 33, 40, 5);
      ctx.fillStyle = '#d43';
      ctx.fillRect(x - 20, y - 33, 40 * clamp(hpRatio, 0, 1), 5);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const cam = getCamera();

    ctx.save();
    ctx.translate(-cam.x, -cam.y);

    ctx.fillStyle = '#1b351c';
    ctx.fillRect(0, 0, world.w, world.h);

    ctx.strokeStyle = 'rgba(255,255,255,.045)';
    ctx.lineWidth = 1;
    for (let x = 0; x < world.w; x += 80) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, world.h); ctx.stroke();
    }
    for (let y = 0; y < world.h; y += 80) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(world.w, y); ctx.stroke();
    }

    ctx.fillStyle = '#4b4637';
    for (const o of obstacles) {
      roundRect(o.x, o.y, o.w, o.h, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.15)';
      ctx.stroke();
    }

    for (const b of bullets) {
      ctx.fillStyle = b.enemy ? '#ffb35c' : '#ffe36f';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const e of enemies) {
      if (e.hp > 0) drawTank(e.x, e.y, e.angle, e.turretAngle, '#8b3434', e.hp / 35, false);
    }

    drawTank(player.x, player.y, player.bodyAngle, player.turretAngle, player.inv > 0 ? '#92d6ff' : '#2f79d8', player.hp / 100, true);

    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / 35, 0, 1);
      ctx.fillStyle = '#ffcf63';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    drawControls();
  }

  function drawControls() {
    const base = input.moveId === null ? { x: 96, y: H - 96 } : input.moveBase;
    const stick = input.moveId === null ? base : input.moveStick;

    ctx.save();
    ctx.globalAlpha = 0.78;
    ctx.strokeStyle = 'rgba(255,255,255,.72)';
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(base.x, base.y, 64, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,.34)';
    ctx.beginPath();
    ctx.arc(stick.x, stick.y, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (input.aimPoint) {
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = 'rgba(255,255,255,.65)';
      ctx.beginPath();
      ctx.arc(input.aimPoint.x, input.aimPoint.y, 24, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(input.aimPoint.x - 34, input.aimPoint.y);
      ctx.lineTo(input.aimPoint.x + 34, input.aimPoint.y);
      ctx.moveTo(input.aimPoint.x, input.aimPoint.y - 34);
      ctx.lineTo(input.aimPoint.x, input.aimPoint.y + 34);
      ctx.stroke();
    }
    ctx.restore();
  }

  function reset() {
    player.x = world.w / 2;
    player.y = world.h / 2;
    player.hp = 100;
    player.fireCooldown = 0;
    score = 0;
    bullets.length = 0;
    particles.length = 0;
    gameOver = false;
    messageEl.textContent = '';
    spawnEnemies();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
