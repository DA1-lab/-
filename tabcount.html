<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>錠剤カウンター試作</title>
  <style>
    :root {
      --card: #111827;
      --muted: #94a3b8;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #fb7185;
      --ok: #34d399;
      --line: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #020617, #0f172a);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 8px 0 4px; }
    p { color: var(--muted); line-height: 1.6; margin: 6px 0; }
    .card {
      background: rgba(17, 24, 39, .9);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin: 14px 0;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button, label.fileBtn {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      color: #00111f;
      background: var(--accent);
      cursor: pointer;
      min-height: 44px;
    }
    button.secondary { background: #334155; color: var(--text); }
    button.danger { background: var(--danger); color: #19020a; }
    input[type="file"] { display: none; }
    .stat {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .box {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }
    .box .num { font-size: 28px; font-weight: 800; }
    .box .cap { color: var(--muted); font-size: 12px; }
    canvas {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: #020617;
      border-radius: 14px;
      border: 1px solid var(--line);
      touch-action: manipulation;
    }
    .control {
      display: grid;
      grid-template-columns: 110px 1fr 48px;
      gap: 8px;
      align-items: center;
      margin: 10px 0;
    }
    .value { color: var(--muted); text-align: right; }
    .small { font-size: 12px; color: var(--muted); }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(52, 211, 153, .15);
      color: var(--ok);
      font-size: 12px;
      margin-left: 6px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>錠剤カウンター試作 <span class="pill">タップ編集版</span></h1>
    <p>赤い円をタップすると除外。見逃し部分をタップすると追加できます。</p>

    <div class="card">
      <div class="row">
        <label class="fileBtn" for="photo">写真を撮る / 選ぶ</label>
        <input id="photo" type="file" accept="image/*" capture="environment" />
        <button class="secondary" id="recount">再カウント</button>
        <button class="secondary" id="undo">1つ戻す</button>
        <button class="danger" id="clear">クリア</button>
      </div>

      <div class="stat">
        <div class="box"><div class="num" id="count">0</div><div class="cap">現在の個数</div></div>
        <div class="box"><div class="num" id="autoCount">0</div><div class="cap">自動検出数</div></div>
        <div class="box"><div class="num" id="editCount">0</div><div class="cap">手動追加/除外</div></div>
      </div>
    </div>

    <div class="card">
      <canvas id="canvas"></canvas>
      <p class="small">赤い太線＝現在カウント中。タップで削除/追加。</p>
    </div>

    <div class="card">
      <h2 style="font-size:18px;margin:0 0 8px;">検出設定</h2>

      <div class="control">
        <span>明るさ差</span>
        <input id="threshold" type="range" min="10" max="120" value="38" />
        <span class="value" id="thresholdVal">38</span>
      </div>

      <div class="control">
        <span>最小サイズ</span>
        <input id="minArea" type="range" min="20" max="2000" value="220" />
        <span class="value" id="minAreaVal">220</span>
      </div>

      <div class="control">
        <span>最大サイズ</span>
        <input id="maxArea" type="range" min="500" max="12000" value="5000" />
        <span class="value" id="maxAreaVal">5000</span>
      </div>

      <div class="control">
        <span>追加円サイズ</span>
        <input id="manualRadius" type="range" min="10" max="120" value="35" />
        <span class="value" id="manualRadiusVal">35</span>
      </div>
    </div>
  </div>

<script>
const photo = document.getElementById('photo');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const countEl = document.getElementById('count');
const autoCountEl = document.getElementById('autoCount');
const editCountEl = document.getElementById('editCount');

const thresholdEl = document.getElementById('threshold');
const minAreaEl = document.getElementById('minArea');
const maxAreaEl = document.getElementById('maxArea');
const manualRadiusEl = document.getElementById('manualRadius');

const thresholdVal = document.getElementById('thresholdVal');
const minAreaVal = document.getElementById('minAreaVal');
const maxAreaVal = document.getElementById('maxAreaVal');
const manualRadiusVal = document.getElementById('manualRadiusVal');

let originalImage = null;
let items = [];
let autoDetectedCount = 0;
let history = [];

function syncLabels() {
  thresholdVal.textContent = thresholdEl.value;
  minAreaVal.textContent = minAreaEl.value;
  maxAreaVal.textContent = maxAreaEl.value;
  manualRadiusVal.textContent = manualRadiusEl.value;
}

function saveHistory() {
  history.push(JSON.stringify(items));
  if (history.length > 30) history.shift();
}

function updateCounts() {
  countEl.textContent = items.length;
  autoCountEl.textContent = autoDetectedCount;
  const diff = items.length - autoDetectedCount;
  editCountEl.textContent = diff >= 0 ? `+${diff}` : `${diff}`;
}

function loadImage(file) {
  const reader = new FileReader();

  reader.onload = () => {
    const img = new Image();

    img.onload = () => {
      originalImage = img;
      detectImage();
    };

    img.onerror = () => alert('画像を読み込めませんでした。');
    img.src = reader.result;
  };

  reader.onerror = () => alert('写真ファイルを読み込めませんでした。');
  reader.readAsDataURL(file);
}

function fitCanvasToImage(img) {
  const maxW = 1400;
  const scale = Math.min(1, maxW / img.width);
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
}

function drawBaseImage() {
  if (!originalImage) return;
  ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
}

function getGrayData(imageData) {
  const { data, width, height } = imageData;
  const gray = new Uint8ClampedArray(width * height);
  let sum = 0;

  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    const v = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
    gray[j] = v;
    sum += v;
  }

  return { gray, avg: sum / gray.length };
}

function floodFill(mask, width, height, sx, sy, visited) {
  const stack = [[sx, sy]];
  let area = 0;
  let minX = sx, maxX = sx, minY = sy, maxY = sy;
  let sumX = 0, sumY = 0;

  visited[sy * width + sx] = 1;

  while (stack.length) {
    const [x, y] = stack.pop();

    area++;
    sumX += x;
    sumY += y;

    minX = Math.min(minX, x);
    maxX = Math.max(maxX, x);
    minY = Math.min(minY, y);
    maxY = Math.max(maxY, y);

    const ns = [[x+1,y], [x-1,y], [x,y+1], [x,y-1]];

    for (const [nx, ny] of ns) {
      if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;

      const idx = ny * width + nx;

      if (!visited[idx] && mask[idx]) {
        visited[idx] = 1;
        stack.push([nx, ny]);
      }
    }
  }

  return {
    area,
    minX,
    maxX,
    minY,
    maxY,
    cx: sumX / area,
    cy: sumY / area
  };
}

function detectImage() {
  if (!originalImage) return;

  syncLabels();
  history = [];

  fitCanvasToImage(originalImage);
  drawBaseImage();

  let imageData;

  try {
    imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  } catch (e) {
    alert('画像解析に失敗しました。');
    return;
  }

  const { gray, avg } = getGrayData(imageData);
  const threshold = Number(thresholdEl.value);
  const minArea = Number(minAreaEl.value);
  const maxArea = Number(maxAreaEl.value);
  const width = canvas.width;
  const height = canvas.height;

  const mask = new Uint8Array(width * height);

  for (let i = 0; i < gray.length; i++) {
    mask[i] = Math.abs(gray[i] - avg) > threshold ? 1 : 0;
  }

  const visited = new Uint8Array(width * height);
  const found = [];

  for (let y = 1; y < height - 1; y++) {
    for (let x = 1; x < width - 1; x++) {
      const idx = y * width + x;

      if (mask[idx] && !visited[idx]) {
        const b = floodFill(mask, width, height, x, y, visited);
        const bw = b.maxX - b.minX + 1;
        const bh = b.maxY - b.minY + 1;
        const boxArea = bw * bh;
        const fill = b.area / boxArea;
        const aspect = Math.max(bw, bh) / Math.max(1, Math.min(bw, bh));

        if (
          b.area >= minArea &&
          b.area <= maxArea &&
          fill > 0.25 &&
          aspect < 3.2
        ) {
          found.push({
            x: b.cx,
            y: b.cy,
            r: Math.max(bw, bh) / 2,
            source: 'auto'
          });
        }
      }
    }
  }

  items = found;
  autoDetectedCount = found.length;
  render();
}

function render() {
  drawBaseImage();

  items.forEach((item, i) => {
    const r = item.r;

    ctx.lineWidth = Math.max(8, canvas.width / 150);
    ctx.strokeStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(item.x, item.y, r, 0, Math.PI * 2);
    ctx.stroke();

    if (item.source === 'manual') {
      ctx.fillStyle = '#ff0000';
      ctx.beginPath();
      ctx.arc(item.x, item.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    const label = String(i + 1);
    const fontSize = Math.max(24, canvas.width / 35);

    ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.lineWidth = Math.max(5, fontSize / 6);
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = '#ff0000';

    const tx = item.x + r + 6;
    const ty = item.y + fontSize / 3;

    ctx.strokeText(label, tx, ty);
    ctx.fillText(label, tx, ty);
  });

  updateCounts();
}

function canvasPointFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches && e.touches[0] ? e.touches[0] : e;

  const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
  const y = (touch.clientY - rect.top) * (canvas.height / rect.height);

  return { x, y };
}

function editByTap(e) {
  if (!originalImage) return;
  e.preventDefault();

  const p = canvasPointFromEvent(e);

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    const dx = p.x - it.x;
    const dy = p.y - it.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance <= it.r + 12) {
      saveHistory();
      items.splice(i, 1);
      render();
      return;
    }
  }

  saveHistory();

  items.push({
    x: p.x,
    y: p.y,
    r: Number(manualRadiusEl.value),
    source: 'manual'
  });

  render();
}

photo.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];

  if (!file) {
    alert('写真が選択されていません。');
    return;
  }

  loadImage(file);
});

document.getElementById('recount').addEventListener('click', detectImage);

document.getElementById('undo').addEventListener('click', () => {
  const prev = history.pop();
  if (!prev) return;

  items = JSON.parse(prev);
  render();
});

document.getElementById('clear').addEventListener('click', () => {
  originalImage = null;
  items = [];
  autoDetectedCount = 0;
  history = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  updateCounts();
});

canvas.addEventListener('click', editByTap);
canvas.addEventListener('touchstart', editByTap, { passive: false });

[thresholdEl, minAreaEl, maxAreaEl].forEach(el => {
  el.addEventListener('input', () => {
    syncLabels();
    detectImage();
  });
});

manualRadiusEl.addEventListener('input', syncLabels);

syncLabels();
updateCounts();
</script>
</body>
</html>
