<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>錠剤カウンター試作</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #fb7185;
      --ok: #34d399;
      --line: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #020617, #0f172a);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 8px 0 4px; }
    p { color: var(--muted); line-height: 1.6; margin: 6px 0; }
    .card {
      background: rgba(17, 24, 39, .9);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin: 14px 0;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button, label.fileBtn {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      color: #00111f;
      background: var(--accent);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
    }
    button.secondary { background: #334155; color: var(--text); }
    button.danger { background: var(--danger); color: #19020a; }
    input[type="file"] { display: none; }
    input[type="range"] { width: 180px; }
    .stat {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .box {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }
    .box .num { font-size: 28px; font-weight: 800; }
    .box .cap { color: var(--muted); font-size: 12px; }
    canvas {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: #020617;
      border-radius: 14px;
      border: 1px solid var(--line);
      touch-action: manipulation;
    }
    .control {
      display: grid;
      grid-template-columns: 110px 1fr 48px;
      gap: 8px;
      align-items: center;
      margin: 10px 0;
    }
    .value { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .small { font-size: 12px; color: var(--muted); }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(52, 211, 153, .15);
      color: var(--ok);
      border: 1px solid rgba(52, 211, 153, .25);
      font-size: 12px;
      margin-left: 6px;
    }
    @media (max-width: 560px) {
      .stat { grid-template-columns: 1fr; }
      .control { grid-template-columns: 90px 1fr 42px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>錠剤カウンター試作 <span class="pill">Web版</span></h1>
    <p>黒・青などの単色トレーに錠剤を重ならないように広げ、真上から撮影してください。検出後は必ず人が確認してください。</p>

    <div class="card">
      <div class="row">
        <label class="fileBtn" for="photo">写真を撮る / 選ぶ</label>
        <input id="photo" type="file" accept="image/*" capture="environment" />
        <button class="secondary" id="recount">再カウント</button>
        <button class="danger" id="clear">クリア</button>
      </div>

      <div class="stat">
        <div class="box"><div class="num" id="count">0</div><div class="cap">推定個数</div></div>
        <div class="box"><div class="num" id="manual">0</div><div class="cap">手動補正後</div></div>
        <div class="box"><div class="row"><button id="minus" class="secondary">−1</button><button id="plus" class="secondary">＋1</button></div><div class="cap">補正</div></div>
      </div>
    </div>

    <div class="card">
      <canvas id="canvas"></canvas>
      <p class="small">赤い円が検出した錠剤候補です。重なり・影・背景の柄があると誤検出します。</p>
    </div>

    <div class="card">
      <h2 style="font-size:18px;margin:0 0 8px;">検出設定</h2>
      <div class="control">
        <span>明るさ差</span>
        <input id="threshold" type="range" min="10" max="120" value="38" />
        <span class="value" id="thresholdVal">38</span>
      </div>
      <div class="control">
        <span>最小サイズ</span>
        <input id="minArea" type="range" min="20" max="2000" value="220" />
        <span class="value" id="minAreaVal">220</span>
      </div>
      <div class="control">
        <span>最大サイズ</span>
        <input id="maxArea" type="range" min="500" max="12000" value="5000" />
        <span class="value" id="maxAreaVal">5000</span>
      </div>
      <p class="small">白〜淡色の錠剤は黒っぽい背景、濃色の錠剤は白っぽい背景の方が安定します。</p>
    </div>
  </div>

<script>
const photo = document.getElementById('photo');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const countEl = document.getElementById('count');
const manualEl = document.getElementById('manual');
const thresholdEl = document.getElementById('threshold');
const minAreaEl = document.getElementById('minArea');
const maxAreaEl = document.getElementById('maxArea');
const thresholdVal = document.getElementById('thresholdVal');
const minAreaVal = document.getElementById('minAreaVal');
const maxAreaVal = document.getElementById('maxAreaVal');
let originalImage = null;
let detected = 0;
let manual = 0;

function syncLabels() {
  thresholdVal.textContent = thresholdEl.value;
  minAreaVal.textContent = minAreaEl.value;
  maxAreaVal.textContent = maxAreaEl.value;
}

function setCounts(n) {
  detected = n;
  manual = n;
  countEl.textContent = detected;
  manualEl.textContent = manual;
}

function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    originalImage = img;
    drawAndDetect();
  };
  img.src = url;
}

function fitCanvasToImage(img) {
  const maxW = 1400;
  const scale = Math.min(1, maxW / img.width);
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

function getGrayData(imageData) {
  const { data, width, height } = imageData;
  const gray = new Uint8ClampedArray(width * height);
  let sum = 0;
  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    const v = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
    gray[j] = v;
    sum += v;
  }
  return { gray, avg: sum / gray.length };
}

function floodFill(mask, width, height, sx, sy, visited) {
  const stack = [[sx, sy]];
  let area = 0, minX = sx, maxX = sx, minY = sy, maxY = sy, sumX = 0, sumY = 0;
  visited[sy * width + sx] = 1;

  while (stack.length) {
    const [x, y] = stack.pop();
    area++; sumX += x; sumY += y;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    const ns = [[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for (const [nx, ny] of ns) {
      if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
      const idx = ny * width + nx;
      if (!visited[idx] && mask[idx]) {
        visited[idx] = 1;
        stack.push([nx, ny]);
      }
    }
  }
  return { area, minX, maxX, minY, maxY, cx: sumX / area, cy: sumY / area };
}

function drawAndDetect() {
  if (!originalImage) return;
  syncLabels();
  fitCanvasToImage(originalImage);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const { gray, avg } = getGrayData(imageData);
  const threshold = Number(thresholdEl.value);
  const minArea = Number(minAreaEl.value);
  const maxArea = Number(maxAreaEl.value);
  const width = canvas.width;
  const height = canvas.height;

  const mask = new Uint8Array(width * height);
  for (let i = 0; i < gray.length; i++) {
    // 背景平均から離れている領域を錠剤候補にする簡易方式
    mask[i] = Math.abs(gray[i] - avg) > threshold ? 1 : 0;
  }

  const visited = new Uint8Array(width * height);
  const blobs = [];

  for (let y = 1; y < height - 1; y++) {
    for (let x = 1; x < width - 1; x++) {
      const idx = y * width + x;
      if (mask[idx] && !visited[idx]) {
        const b = floodFill(mask, width, height, x, y, visited);
        const bw = b.maxX - b.minX + 1;
        const bh = b.maxY - b.minY + 1;
        const boxArea = bw * bh;
        const fill = b.area / boxArea;
        const aspect = Math.max(bw, bh) / Math.max(1, Math.min(bw, bh));

        if (
          b.area >= minArea &&
          b.area <= maxArea &&
          fill > 0.25 &&
          aspect < 3.2
        ) {
          blobs.push({ ...b, bw, bh });
        }
      }
    }
  }

  ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
  ctx.lineWidth = Math.max(2, canvas.width / 500);
  ctx.strokeStyle = '#fb7185';
  ctx.fillStyle = '#fb7185';
  ctx.font = `${Math.max(12, canvas.width / 55)}px -apple-system, BlinkMacSystemFont, sans-serif`;

  blobs.forEach((b, i) => {
    const r = Math.max(b.bw, b.bh) / 2;
    ctx.beginPath();
    ctx.arc(b.cx, b.cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillText(String(i + 1), b.cx + r + 3, b.cy);
  });

  setCounts(blobs.length);
}

photo.addEventListener('change', e => {
  const file = e.target.files?.[0];
  if (file) loadImage(file);
});

document.getElementById('recount').addEventListener('click', drawAndDetect);
document.getElementById('clear').addEventListener('click', () => {
  originalImage = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  setCounts(0);
});
document.getElementById('plus').addEventListener('click', () => {
  manual++;
  manualEl.textContent = manual;
});
document.getElementById('minus').addEventListener('click', () => {
  manual = Math.max(0, manual - 1);
  manualEl.textContent = manual;
});
[thresholdEl, minAreaEl, maxAreaEl].forEach(el => {
  el.addEventListener('input', () => { syncLabels(); drawAndDetect(); });
});
syncLabels();
</script>
</body>
</html>
