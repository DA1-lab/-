<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>錠剤カウンター</title>
<style>
body{font-family:-apple-system,sans-serif;padding:16px;background:#0f172a;color:white}
button,label{display:inline-block;padding:12px 16px;margin:6px;border-radius:12px;background:#38bdf8;color:#00111f;font-weight:bold}
input{display:none}
canvas{width:100%;border:1px solid #555;border-radius:12px;margin-top:12px;touch-action:manipulation}
.num{font-size:32px;font-weight:bold}
.note{color:#cbd5e1;font-size:14px;line-height:1.6}
</style>
</head>
<body>

<h1>錠剤カウンター</h1>

<label for="photo">写真を撮る / 選ぶ</label>
<input id="photo" type="file" accept="image/*" capture="environment">
<button onclick="detect()">再カウント</button>

<p>個数：<span id="count" class="num">0</span></p>
<p class="note">
赤い円をタップ：除外<br>
見逃し部分をタップ：追加
</p>

<canvas id="canvas"></canvas>

<script>
const photo=document.getElementById("photo");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
const countEl=document.getElementById("count");

let originalImage=null;
let items=[];

photo.addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      originalImage=img;
      detect();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});

function detect(){
  if(!originalImage)return;

  const maxW=1200;
  const scale=Math.min(1,maxW/originalImage.width);

  canvas.width=originalImage.width*scale;
  canvas.height=originalImage.height*scale;

  ctx.drawImage(originalImage,0,0,canvas.width,canvas.height);

  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const data=imgData.data;
  const w=canvas.width;
  const h=canvas.height;

  let gray=[];
  let sum=0;

  for(let i=0;i<data.length;i+=4){
    const v=Math.round(0.299*data[i]+0.587*data[i+1]+0.114*data[i+2]);
    gray.push(v);
    sum+=v;
  }

  const avg=sum/gray.length;
  const mask=new Uint8Array(w*h);

  for(let i=0;i<gray.length;i++){
    mask[i]=Math.abs(gray[i]-avg)>38?1:0;
  }

  const visited=new Uint8Array(w*h);
  items=[];

  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const idx=y*w+x;
      if(mask[idx]&&!visited[idx]){
        const b=flood(mask,visited,w,h,x,y);

        const bw=b.maxX-b.minX+1;
        const bh=b.maxY-b.minY+1;
        const boxArea=bw*bh;
        const fill=b.area/boxArea;
        const aspect=Math.max(bw,bh)/Math.max(1,Math.min(bw,bh));

        if(b.area>220 && b.area<5000 && fill>0.25 && aspect<3.2){
          items.push({
            x:b.sumX/b.area,
            y:b.sumY/b.area,
            r:Math.max(bw,bh)/2,
            manual:false
          });
        }
      }
    }
  }

  redraw();
}

canvas.addEventListener("click",e=>{
  if(!originalImage)return;

  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(canvas.width/rect.width);
  const y=(e.clientY-rect.top)*(canvas.height/rect.height);

  let hitIndex=-1;

  for(let i=0;i<items.length;i++){
    const it=items[i];
    const dx=x-it.x;
    const dy=y-it.y;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist < Math.max(it.r+20,35)){
      hitIndex=i;
      break;
    }
  }

  if(hitIndex>=0){
    items.splice(hitIndex,1);
  }else{
    items.push({
      x:x,
      y:y,
      r:35,
      manual:true
    });
  }

  redraw();
});

function redraw(){
  ctx.drawImage(originalImage,0,0,canvas.width,canvas.height);

  items.forEach((it,i)=>{
    ctx.lineWidth=Math.max(8,canvas.width/150);
    ctx.strokeStyle=it.manual ? "#00ff66" : "#ff0000";
    ctx.beginPath();
    ctx.arc(it.x,it.y,it.r,0,Math.PI*2);
    ctx.stroke();

    const text=String(i+1);
    ctx.font=`bold ${Math.max(26,canvas.width/32)}px sans-serif`;

    ctx.lineWidth=6;
    ctx.strokeStyle="white";
    ctx.strokeText(text,it.x+it.r+6,it.y);

    ctx.fillStyle=it.manual ? "#00ff66" : "#ff0000";
    ctx.fillText(text,it.x+it.r+6,it.y);
  });

  countEl.textContent=items.length;
}

function flood(mask,visited,w,h,sx,sy){
  const stack=[[sx,sy]];
  visited[sy*w+sx]=1;

  let area=0;
  let minX=sx,maxX=sx,minY=sy,maxY=sy;
  let sumX=0,sumY=0;

  while(stack.length){
    const [x,y]=stack.pop();
    area++;
    sumX+=x;
    sumY+=y;

    minX=Math.min(minX,x);
    maxX=Math.max(maxX,x);
    minY=Math.min(minY,y);
    maxY=Math.max(maxY,y);

    [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].forEach(([nx,ny])=>{
      if(nx<0||ny<0||nx>=w||ny>=h)return;
      const idx=ny*w+nx;
      if(mask[idx]&&!visited[idx]){
        visited[idx]=1;
        stack.push([nx,ny]);
      }
    });
  }

  return {area,minX,maxX,minY,maxY,sumX,sumY};
}
</script>

</body>
</html>
