<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>棚卸しスキャナ</title>

<style>
  :root{
    --bg:#0b1220;
    --panel:#111827;
    --panel2:#172033;
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#38bdf8;
    --ok:#22c55e;
    --warn:#f59e0b;
    --key:#1e293b;
    --key-active:#334155;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
  }
  body{min-height:100svh}
  .app{
    width:min(100%,480px);
    min-height:100svh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px);
    gap:10px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:42px;
  }
  .title{font-weight:800;font-size:20px;letter-spacing:.02em}
  .sub{font-size:12px;color:var(--muted)}
  .pill{
    font-size:12px;
    background:#162238;
    border:1px solid #26354d;
    border-radius:999px;
    padding:7px 10px;
    color:#cbd5e1;
  }

  /* Camera */
  .camera{
    position:relative;
    height:140px;
    border:1px solid #334155;
    border-radius:18px;
    overflow:hidden;
    background:#020617;
  }
  #cameraVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#020617;
  }
  .scanline{
    position:absolute;
    z-index:3;
    left:10%;
    right:10%;
    top:50%;
    height:2px;
    transform:translateY(-50%);
    background:#ef4444;
    box-shadow:0 0 8px rgba(239,68,68,.85);
    pointer-events:none;
  }
  .camera-action{
    position:absolute;
    z-index:5;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,6,23,.68);
  }
  .camera-action.show{display:flex}
  .camera-action button{
    border:1px solid #475569;
    border-radius:12px;
    background:#172033;
    color:#fff;
    padding:11px 16px;
    font-size:15px;
    font-weight:700;
  }

  /* Drug */
  .drug{
    background:var(--panel);
    border:1px solid #243147;
    border-radius:16px;
    padding:14px;
  }
  .drug-head{
    display:flex;
    gap:10px;
    justify-content:space-between;
    align-items:flex-start;
  }
  .drug-name{
    font-weight:800;
    font-size:19px;
    line-height:1.35;
  }
  .drug-meta{
    margin-top:4px;
    color:var(--muted);
    font-size:13px;
    overflow-wrap:anywhere;
  }
  .status{
    flex:none;
    font-size:12px;
    font-weight:800;
    border-radius:999px;
    padding:6px 9px;
  }
  .status.todo{
    background:rgba(245,158,11,.14);
    color:#fbbf24;
    border:1px solid rgba(245,158,11,.35);
  }
  .status.done{
    background:rgba(34,197,94,.14);
    color:#4ade80;
    border:1px solid rgba(34,197,94,.35);
  }

  .inputs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .field{
    position:relative;
    background:var(--panel2);
    border:2px solid transparent;
    border-radius:14px;
    padding:10px 11px;
    min-height:84px;
  }
  .field.active{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(56,189,248,.09);
  }
  .field-label{font-size:12px;color:#cbd5e1}
  .field-value{
    font-size:32px;
    font-weight:900;
    line-height:1.05;
    margin-top:7px;
    font-variant-numeric:tabular-nums;
  }
  .field-unit{
    font-size:13px;
    color:var(--muted);
    margin-left:4px;
  }
  .total{
    margin-top:10px;
    text-align:right;
    color:#cbd5e1;
    font-size:13px;
  }
  .total b{color:#fff;font-size:17px}

  /* Keypad */
  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:auto;
  }
  button{
    appearance:none;
    border:0;
    color:#fff;
    font:inherit;
    cursor:pointer;
  }
  .key{
    min-height:58px;
    border-radius:14px;
    background:var(--key);
    border:1px solid #314057;
    font-size:25px;
    font-weight:800;
  }
  .key:active{
    background:var(--key-active);
    transform:scale(.985);
  }
  .enter{
    background:#0369a1;
    border-color:#0284c7;
    font-size:18px;
  }
  .enter:active{background:#075985}
  .clear{font-size:20px;color:#cbd5e1}

  .footer{display:flex;gap:8px;margin-top:2px}
  .ghost{
    flex:1;
    min-height:42px;
    border-radius:12px;
    background:#111827;
    border:1px solid #2a3850;
    color:#cbd5e1;
    font-size:13px;
  }

  .toast{
    position:fixed;
    z-index:20;
    left:50%;
    bottom:calc(env(safe-area-inset-bottom) + 92px);
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    background:#020617;
    border:1px solid #334155;
    border-radius:999px;
    padding:9px 14px;
    font-size:13px;
    transition:.2s;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-height:780px){
    .camera{height:120px}
    .key{min-height:50px}
    .field{min-height:76px}
    .field-value{font-size:28px}
  }
</style>
</head>

<body>
<main class="app">
  <header class="topbar">
    <div>
      <div class="title">棚卸し</div>
      <div class="sub">薬品棚モード</div>
    </div>
    <div class="pill" id="recordCount">記録済 0品目</div>
  </header>

  <section class="camera" aria-label="バーコードカメラ">
    <video id="cameraVideo" autoplay muted playsinline></video>
    <div class="scanline" aria-hidden="true"></div>
    <div class="camera-action" id="cameraAction">
      <button type="button" id="cameraRetry">カメラ開始</button>
    </div>
  </section>

  <section class="drug">
    <div class="drug-head">
      <div>
        <div class="drug-name" id="drugName">バーコード待機中</div>
        <div class="drug-meta" id="drugMeta">—</div>
      </div>
      <div class="status todo" id="status">未記録</div>
    </div>

    <div class="inputs">
      <div class="field active" id="boxField">
        <div class="field-label">未開封箱（@<span id="packA">—</span>錠）</div>
        <div>
          <span class="field-value" id="boxValue">0</span>
          <span class="field-unit">箱</span>
        </div>
      </div>

      <div class="field" id="openField">
        <div class="field-label">開封箱（@<span id="packB">—</span>錠）</div>
        <div>
          <span class="field-value" id="openValue">0</span>
          <span class="field-unit">錠</span>
        </div>
      </div>
    </div>

    <div class="total">合計 <b id="totalValue">—</b></div>
  </section>

  <section class="keypad">
    <button class="key" data-num="1">1</button>
    <button class="key" data-num="2">2</button>
    <button class="key" data-num="3">3</button>
    <button class="key" data-num="4">4</button>
    <button class="key" data-num="5">5</button>
    <button class="key" data-num="6">6</button>
    <button class="key" data-num="7">7</button>
    <button class="key" data-num="8">8</button>
    <button class="key" data-num="9">9</button>
    <button class="key clear" id="clear">⌫</button>
    <button class="key" data-num="0">0</button>
    <button class="key enter" id="enter">Enter</button>
  </section>

  <div class="footer">
    <button class="ghost" id="reset">入力リセット</button>
    <button class="ghost" id="restartCamera">カメラ再起動</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  /*
   * 商品マスタは後でODSS等から取り込む想定。
   * key = 読み取ったGTIN/JAN等
   * pack = 1箱あたりの錠数
   *
   * 例:
   * const PRODUCT_MASTER = {
   *   "04912345678901": { name:"薬品名", pack:100 }
   * };
   */
  const PRODUCT_MASTER = {};

  const records = new Map();

  let currentCode = "";
  let currentRawCode = "";
  let currentProduct = null;
  let active = "box";
  let boxText = "0";
  let openText = "0";

  let reader = null;
  let scannerControls = null;
  let scanLocked = false;
  let lastAcceptedCode = "";
  let lastAcceptedAt = 0;

  const video = $("cameraVideo");
  const boxField = $("boxField");
  const openField = $("openField");

  function normalizeCode(raw) {
    const s = String(raw || "").trim();

    // GS1 human-readable form: (01)xxxxxxxxxxxxxx
    const ai01Paren = s.match(/\(01\)\s*(\d{14})/);
    if (ai01Paren) return ai01Paren[1];

    // FNC1/GS1文字列内に 01 + 14桁 が含まれる場合
    const ai01 = s.match(/(?:^|[^\d])01(\d{14})(?:[^\d]|$)/);
    if (ai01) return ai01[1];

    // JAN/EAN/GTINそのもの
    const digitsOnly = s.replace(/\s+/g, "");
    if (/^\d{8}$|^\d{12}$|^\d{13}$|^\d{14}$/.test(digitsOnly)) {
      return digitsOnly;
    }

    return s;
  }

  function getProduct(code) {
    return PRODUCT_MASTER[code] || null;
  }

  function render() {
    const existing = currentCode ? records.get(currentCode) : null;

    if (!currentCode) {
      $("drugName").textContent = "バーコード待機中";
      $("drugMeta").textContent = "—";
      $("status").textContent = "未記録";
      $("status").className = "status todo";
      $("packA").textContent = "—";
      $("packB").textContent = "—";
    } else {
      $("drugName").textContent = currentProduct?.name || "未登録薬品";
      $("drugMeta").textContent =
        `${currentProduct?.pack ? currentProduct.pack + "錠包装 ・ " : ""}コード ${currentCode}`;

      $("status").textContent = existing ? "記録済" : "未記録";
      $("status").className = existing ? "status done" : "status todo";

      const packLabel = currentProduct?.pack ?? "—";
      $("packA").textContent = packLabel;
      $("packB").textContent = packLabel;
    }

    $("boxValue").textContent = boxText;
    $("openValue").textContent = openText;

    boxField.classList.toggle("active", active === "box");
    openField.classList.toggle("active", active === "open");

    if (currentProduct?.pack) {
      const total =
        parseInt(boxText || "0", 10) * currentProduct.pack +
        parseInt(openText || "0", 10);
      $("totalValue").textContent = `${total.toLocaleString()}錠`;
    } else {
      $("totalValue").textContent = "—";
    }

    $("recordCount").textContent = `記録済 ${records.size}品目`;
  }

  function showToast(text, ms = 1000) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove("show"), ms);
  }

  function appendNumber(n) {
    if (!currentCode) return;

    if (active === "box") {
      boxText = boxText === "0" ? n : boxText + n;
    } else {
      openText = openText === "0" ? n : openText + n;
    }
    render();
  }

  function backspace() {
    if (!currentCode) return;

    if (active === "box") {
      boxText = boxText.length <= 1 ? "0" : boxText.slice(0, -1);
    } else {
      openText = openText.length <= 1 ? "0" : openText.slice(0, -1);
    }
    render();
  }

  function acceptBarcode(rawCode) {
    const code = normalizeCode(rawCode);
    if (!code || scanLocked) return;

    const now = Date.now();
    if (code === lastAcceptedCode && now - lastAcceptedAt < 1800) return;

    scanLocked = true;
    lastAcceptedCode = code;
    lastAcceptedAt = now;

    currentRawCode = rawCode;
    currentCode = code;
    currentProduct = getProduct(code);

    const existing = records.get(code);
    boxText = existing ? String(existing.box) : "0";
    openText = existing ? String(existing.open) : "0";
    active = "box";

    render();

    if (navigator.vibrate) navigator.vibrate(35);
    showToast(currentProduct ? currentProduct.name : `読取 ${code}`, 900);
  }

  function finishRecord() {
    if (!currentCode) return;

    records.set(currentCode, {
      code: currentCode,
      rawCode: currentRawCode,
      name: currentProduct?.name || "",
      pack: currentProduct?.pack || null,
      box: parseInt(boxText || "0", 10),
      open: parseInt(openText || "0", 10),
      updatedAt: new Date().toISOString()
    });

    render();
    if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
    showToast("記録しました", 800);

    // 同じ箱を向けたまま再読取しないよう少し待ってから解放
    const justRecorded = currentCode;
    setTimeout(() => {
      scanLocked = false;
      lastAcceptedCode = justRecorded;
      lastAcceptedAt = Date.now();

      currentCode = "";
      currentRawCode = "";
      currentProduct = null;
      boxText = "0";
      openText = "0";
      active = "box";
      render();
    }, 650);
  }

  async function stopScanner() {
    try {
      if (scannerControls) scannerControls.stop();
    } catch (_) {}
    scannerControls = null;

    try {
      const stream = video.srcObject;
      if (stream && stream.getTracks) {
        stream.getTracks().forEach(track => track.stop());
      }
    } catch (_) {}

    video.srcObject = null;
  }

  function cameraErrorMessage(err) {
    if (!window.isSecureContext) {
      return "HTTPSで開いてください";
    }
    if (err?.name === "NotAllowedError") {
      return "カメラを許可してください";
    }
    if (err?.name === "NotFoundError") {
      return "カメラが見つかりません";
    }
    return "カメラを開始できません";
  }

  async function startScanner() {
    await stopScanner();

    if (!navigator.mediaDevices?.getUserMedia || !window.ZXingBrowser) {
      $("cameraRetry").textContent = !window.isSecureContext
        ? "HTTPSで開いてください"
        : "カメラを開始できません";
      $("cameraAction").classList.add("show");
      return;
    }

    $("cameraAction").classList.remove("show");

    try {
      reader = new ZXingBrowser.BrowserMultiFormatReader();

      scannerControls = await reader.decodeFromConstraints(
        {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        video,
        (result) => {
          if (!result) return;
          acceptBarcode(result.getText());
        }
      );
    } catch (err) {
      console.error(err);
      $("cameraRetry").textContent = cameraErrorMessage(err);
      $("cameraAction").classList.add("show");
    }
  }

  document.querySelectorAll("[data-num]").forEach(btn => {
    btn.addEventListener("click", () => appendNumber(btn.dataset.num));
  });

  $("clear").addEventListener("click", backspace);

  boxField.addEventListener("click", () => {
    active = "box";
    render();
  });

  openField.addEventListener("click", () => {
    active = "open";
    render();
  });

  $("enter").addEventListener("click", () => {
    if (!currentCode) return;

    if (active === "box") {
      active = "open";
      render();
      return;
    }

    finishRecord();
  });

  $("reset").addEventListener("click", () => {
    boxText = "0";
    openText = "0";
    active = "box";
    render();
  });

  $("restartCamera").addEventListener("click", startScanner);
  $("cameraRetry").addEventListener("click", startScanner);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !scannerControls) {
      startScanner();
    }
  });

  window.addEventListener("pagehide", stopScanner);

  render();
  startScanner();
})();
</script>
</body>
</html>
