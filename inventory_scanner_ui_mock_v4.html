<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0d12">
<title>棚卸しスキャナ</title>

<style>
:root{
  --bg:#0a0d12;
  --panel:#11161d;
  --panel2:#171e27;
  --line:#273240;
  --text:#f8fafc;
  --muted:#93a4b8;
  --accent:#2f9bff;
  --red:#ef4444;
  --ok:#35d07f;
  --warn:#ffbf47;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
}

body{
  touch-action:manipulation;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  appearance:none;
  touch-action:manipulation;
}

.app{
  width:min(100%,520px);
  height:100svh;
  height:100dvh;
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top) + 8px)
    10px
    calc(env(safe-area-inset-bottom) + 8px);
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:hidden;
}

/* 固定領域 */
.header,
.drug,
.entry,
.total,
.keypad{
  flex:0 0 auto;
}

/* 余った高さだけカメラが伸びる */
.camera{
  flex:1 1 auto;
  min-height:105px;
  max-height:260px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:15px;
  background:#05080d;
}

#cameraVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.scanline{
  position:absolute;
  z-index:3;
  left:7%;
  right:7%;
  top:50%;
  height:2px;
  transform:translateY(-50%);
  background:var(--red);
  box-shadow:0 0 8px rgba(239,68,68,.9);
  pointer-events:none;
}

.cameraOverlay{
  position:absolute;
  inset:0;
  z-index:4;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(5,8,13,.68);
}

.cameraOverlay.show{display:flex}

.cameraOverlay button{
  padding:10px 15px;
  border-radius:11px;
  border:1px solid #445063;
  background:#172033;
  font-weight:800;
}

.header{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4px;
}

.headerTitle{
  font-size:20px;
  font-weight:900;
}

.counter{
  font-size:12px;
  color:var(--muted);
}

.drug{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  background:var(--panel);
  border:1px solid #202a36;
  border-radius:14px;
  padding:10px 12px;
  min-height:68px;
}

.drugName{
  font-size:17px;
  font-weight:900;
  line-height:1.25;
  max-height:44px;
  overflow:hidden;
}

.drugMeta{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
  overflow-wrap:anywhere;
}

.status{
  flex:none;
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  background:#3a2710;
  color:var(--warn);
  border:1px solid #65461d;
}

.status.done{
  background:#113520;
  color:#76e7a1;
  border-color:#23683e;
}

.entry{
  min-height:70px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 44%;
  gap:8px;
  align-items:center;
  background:var(--panel);
  border:1px solid #202a36;
  border-radius:14px;
  padding:9px 11px;
}

.entry.active{
  border:2px solid var(--accent);
  padding:8px 10px;
  background:#102039;
}

.entryLabel{
  font-size:16px;
  font-weight:900;
}

.entrySub{
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}

.entryValue{
  text-align:right;
  font-size:31px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.unit{
  margin-left:4px;
  font-size:12px;
  color:#cbd5e1;
}

.expr{
  margin-top:2px;
  font-size:12px;
  color:#a9bdd6;
  font-weight:700;
  min-height:15px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.total{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--panel);
  border:1px solid #202a36;
  border-radius:13px;
  padding:8px 12px;
}

.totalLabel{
  font-size:16px;
  font-weight:900;
}

.totalValue{
  font-size:26px;
  font-weight:950;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(4,minmax(48px,1fr));
  gap:6px;
  min-height:226px;
  max-height:286px;
}

.key{
  min-width:0;
  border-radius:12px;
  border:1px solid #344151;
  background:#1b2532;
  font-size:24px;
  font-weight:900;
}

.key:active{
  transform:scale(.985);
  background:#263345;
}

.op{
  background:#152638;
  font-size:27px;
}

.back{
  background:#171e27;
  font-size:21px;
}

.zero{
  grid-column:span 2;
}

.enter{
  grid-column:span 2;
  background:#1677e8;
  border-color:#258cff;
  font-size:20px;
}

.enter:active{
  background:#0f67cb;
}

.toast{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  transform:translate(-50%,15px);
  opacity:0;
  pointer-events:none;
  background:#020617;
  border:1px solid #334155;
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  transition:.18s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* 小さい画面でもスクロールさせず、カメラだけ先に縮む */
@media (max-height:760px){
  .app{gap:6px}
  .camera{min-height:78px;max-height:160px}
  .drug{min-height:60px;padding:8px 10px}
  .drugName{font-size:16px}
  .entry{min-height:62px}
  .entryValue{font-size:28px}
  .total{min-height:42px}
  .totalValue{font-size:23px}
  .keypad{min-height:210px;gap:5px}
  .key{font-size:22px}
}

@media (max-height:680px){
  .camera{min-height:60px}
  .header{min-height:36px}
  .drug{min-height:54px}
  .entry{min-height:56px}
  .keypad{min-height:196px}
}
</style>
</head>

<body>
<main class="app">

  <header class="header">
    <div class="headerTitle">棚卸し</div>
    <div class="counter" id="counter">記録済 0品目</div>
  </header>

  <section class="camera">
    <video id="cameraVideo" autoplay muted playsinline></video>
    <div class="scanline"></div>
    <div class="cameraOverlay" id="cameraOverlay">
      <button type="button" id="cameraStart">カメラ開始</button>
    </div>
  </section>

  <section class="drug">
    <div>
      <div class="drugName" id="drugName">バーコード待機中</div>
      <div class="drugMeta" id="drugMeta">—</div>
    </div>
    <div class="status" id="status">未記録</div>
  </section>

  <section class="entry active" id="boxEntry">
    <div>
      <div class="entryLabel">未開封箱</div>
      <div class="entrySub">@<span id="packBox">—</span></div>
      <div class="expr" id="boxExpr"></div>
    </div>
    <div class="entryValue">
      <span id="boxValue">0</span><span class="unit">箱</span>
    </div>
  </section>

  <section class="entry" id="openEntry">
    <div>
      <div class="entryLabel">開封箱内</div>
      <div class="entrySub">@<span id="packOpen">—</span></div>
      <div class="expr" id="openExpr"></div>
    </div>
    <div class="entryValue">
      <span id="openValue">0</span><span class="unit" id="openUnit">錠</span>
    </div>
  </section>

  <section class="total">
    <div class="totalLabel">合計</div>
    <div class="totalValue" id="totalValue">—</div>
  </section>

  <section class="keypad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key back" data-key="⌫">⌫</button>

    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key op" data-key="*">*</button>

    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key op" data-key="+">+</button>

    <button class="key zero" data-key="0">0</button>
    <button class="key enter" data-key="Enter">Enter</button>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  /*
   * 後でODSS等の商品マスタに置換する。
   * pack = 1箱あたり数量
   * unit = 錠 / 包 / カプセル 等
   */
  const PRODUCT_MASTER = {
    // UI確認用のサンプル。
    // 実際のバーコードに合わせて追加可。
    "4987138461234": {
      name: "ツムラ大建中湯エキス顆粒",
      pack: 42,
      unit: "包"
    }
  };

  const records = new Map();

  let currentCode = "";
  let product = null;
  let active = "box";
  let expr = { box:"", open:"" };
  let value = { box:0, open:0 };

  let scannerControls = null;
  let scanLocked = false;
  let lastCode = "";
  let lastAt = 0;

  function normalizeCode(raw){
    const s = String(raw || "").trim();

    const p = s.match(/\(01\)\s*(\d{14})/);
    if (p) return p[1];

    const digits = s.replace(/\s+/g,"");
    if (/^\d{8}$|^\d{12}$|^\d{13}$|^\d{14}$/.test(digits)) return digits;

    return s;
  }

  function safeCalc(input){
    const s = String(input || "")
      .replace(/\s/g,"")
      .replace(/[xX×＊]/g,"*");

    if (!s) return 0;
    if (!/^\d+(?:[+*]\d+)*$/.test(s)) throw new Error("式が不正です");

    // * を先に計算し、その後 + を計算
    return s.split("+").reduce((sum, term) => {
      const product = term.split("*").reduce((a,b) => a * Number(b), 1);
      return sum + product;
    }, 0);
  }

  function currentPack(){
    return product?.pack || null;
  }

  function unit(){
    return product?.unit || "錠";
  }

  function showToast(text, ms=850){
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(()=>t.classList.remove("show"), ms);
  }

  function render(){
    const existing = currentCode ? records.get(currentCode) : null;

    if (!currentCode){
      $("drugName").textContent = "バーコード待機中";
      $("drugMeta").textContent = "—";
      $("status").textContent = "未記録";
      $("status").className = "status";
      $("packBox").textContent = "—";
      $("packOpen").textContent = "—";
      $("openUnit").textContent = "錠";
    }else{
      $("drugName").textContent = product?.name || "未登録薬品";
      $("drugMeta").textContent = `コード ${currentCode}`;
      $("status").textContent = existing ? "記録済" : "未記録";
      $("status").className = existing ? "status done" : "status";
      $("packBox").textContent = product?.pack ? `${product.pack}${unit()}` : "—";
      $("packOpen").textContent = product?.pack ? `${product.pack}${unit()}` : "—";
      $("openUnit").textContent = unit();
    }

    $("boxEntry").classList.toggle("active", active==="box");
    $("openEntry").classList.toggle("active", active==="open");

    $("boxValue").textContent = value.box;
    $("openValue").textContent = value.open;

    $("boxExpr").textContent = expr.box && expr.box !== String(value.box) ? expr.box : "";
    $("openExpr").textContent = expr.open && expr.open !== String(value.open) ? expr.open : "";

    if (product?.pack){
      const total = value.box * product.pack + value.open;
      $("totalValue").textContent = `${total.toLocaleString()} ${unit()}`;
    }else{
      $("totalValue").textContent = "—";
    }

    $("counter").textContent = `記録済 ${records.size}品目`;
  }

  function setExpression(which, next){
    expr[which] = next;

    try{
      if (/^\d+(?:[+*]\d+)*$/.test(next)){
        value[which] = safeCalc(next);
      }else if (/^\d+$/.test(next)){
        value[which] = Number(next);
      }
    }catch(_){}

    render();
  }

  function press(key){
    if (!currentCode) return;

    const which = active;
    let s = expr[which];

    if (key === "⌫"){
      s = s.slice(0,-1);
      if (!s){
        expr[which] = "";
        value[which] = 0;
        render();
        return;
      }
      setExpression(which, s);
      return;
    }

    if (key === "+" || key === "*"){
      if (!s) s = String(value[which] || 0);
      if (/[+*]$/.test(s)){
        s = s.slice(0,-1) + key;
      }else{
        s += key;
      }
      setExpression(which, s);
      return;
    }

    if (/^\d$/.test(key)){
      if (!s || s === "0") s = key;
      else s += key;
      setExpression(which, s);
      return;
    }

    if (key === "Enter"){
      if (s){
        try{
          value[which] = safeCalc(s);
          expr[which] = s;
        }catch(e){
          showToast("式を確認してください");
          return;
        }
      }

      if (which === "box"){
        active = "open";
        render();
        return;
      }

      saveRecord();
    }
  }

  function saveRecord(){
    if (!currentCode) return;

    records.set(currentCode,{
      code:currentCode,
      name:product?.name || "",
      pack:product?.pack || null,
      unit:unit(),
      box:value.box,
      open:value.open,
      boxExpr:expr.box,
      openExpr:expr.open,
      updatedAt:new Date().toISOString()
    });

    if (navigator.vibrate) navigator.vibrate([30,25,30]);
    showToast("記録しました");
    render();

    setTimeout(()=>{
      currentCode = "";
      product = null;
      active = "box";
      expr = {box:"",open:""};
      value = {box:0,open:0};
      scanLocked = false;
      render();
    },500);
  }

  function acceptBarcode(raw){
    const code = normalizeCode(raw);
    if (!code || scanLocked) return;

    const now = Date.now();
    if (code === lastCode && now-lastAt < 1500) return;

    scanLocked = true;
    lastCode = code;
    lastAt = now;

    currentCode = code;
    product = PRODUCT_MASTER[code] || null;

    const existing = records.get(code);
    if (existing){
      value.box = existing.box || 0;
      value.open = existing.open || 0;
      expr.box = existing.boxExpr || String(value.box);
      expr.open = existing.openExpr || String(value.open);
    }else{
      value = {box:0,open:0};
      expr = {box:"",open:""};
    }

    active = "box";
    render();

    if (navigator.vibrate) navigator.vibrate(25);
    showToast(`読取 ${code}`);

    // 数量入力中に別コードへ飛ばないようロックは保存まで維持
  }

  async function stopScanner(){
    try{
      scannerControls?.stop();
    }catch(_){}
    scannerControls = null;

    try{
      const stream = $("cameraVideo").srcObject;
      stream?.getTracks?.().forEach(t=>t.stop());
    }catch(_){}

    $("cameraVideo").srcObject = null;
  }

  async function startScanner(){
    await stopScanner();

    if (!window.isSecureContext){
      $("cameraStart").textContent = "HTTPSで開いてください";
      $("cameraOverlay").classList.add("show");
      return;
    }

    if (!navigator.mediaDevices?.getUserMedia || !window.ZXingBrowser){
      $("cameraStart").textContent = "カメラを開始できません";
      $("cameraOverlay").classList.add("show");
      return;
    }

    $("cameraOverlay").classList.remove("show");

    try{
      const reader = new ZXingBrowser.BrowserMultiFormatReader();

      scannerControls = await reader.decodeFromConstraints(
        {
          audio:false,
          video:{
            facingMode:{ideal:"environment"},
            width:{ideal:1280},
            height:{ideal:720}
          }
        },
        $("cameraVideo"),
        result=>{
          if (result) acceptBarcode(result.getText());
        }
      );
    }catch(err){
      console.error(err);
      $("cameraStart").textContent =
        err?.name === "NotAllowedError"
          ? "カメラを許可してください"
          : "カメラ開始";
      $("cameraOverlay").classList.add("show");
    }
  }


  // iOS Safari のピンチイン/ピンチアウトを禁止
  ["gesturestart","gesturechange","gestureend"].forEach(type => {
    document.addEventListener(type, e => e.preventDefault(), { passive:false });
  });

  document.addEventListener("touchmove", e => {
    if (e.touches && e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive:false });


  // ダブルタップ拡大を禁止（テンキー等のbutton連打は妨げない）
  let lastNonButtonTouchEnd = 0;

  document.addEventListener("touchend", e => {
    if (e.target.closest && e.target.closest("button")) return;

    const now = Date.now();
    if (now - lastNonButtonTouchEnd <= 320) {
      e.preventDefault();
    }
    lastNonButtonTouchEnd = now;
  }, { passive:false });

  document.addEventListener("dblclick", e => {
    e.preventDefault();
  }, { passive:false });

  document.querySelectorAll("[data-key]").forEach(btn=>{
    btn.addEventListener("click",()=>press(btn.dataset.key));
  });

  $("boxEntry").addEventListener("click",()=>{
    active="box";
    render();
  });

  $("openEntry").addEventListener("click",()=>{
    active="open";
    render();
  });

  $("cameraStart").addEventListener("click",startScanner);

  document.addEventListener("visibilitychange",()=>{
    if (document.visibilityState==="visible" && !scannerControls){
      startScanner();
    }
  });

  window.addEventListener("pagehide",stopScanner);

  render();
  startScanner();
})();
</script>
</body>
</html>
