<!doctype html>

<style>
:root{--bg:#111713;--panel:rgba(14,18,15,.88);--ink:#f0ead7;--muted:#bbb5a6;--e:#e85b55;--w:#4f7fd1;--n:#c7a64b}
*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;pointer-events:none}.card{background:var(--panel);border:1px solid #ffffff1a;border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 12px 35px #0005}.title{padding:10px 12px;max-width:72vw}.eyebrow{font-size:10px;letter-spacing:.14em;color:#d8c77b}.title h1{font-family:"Yu Mincho",serif;font-size:clamp(20px,5vw,32px);margin:2px 0}.sub{font-size:11px;color:var(--muted)}.badge{font:10px sans-serif;border:1px solid #ffffff20;border-radius:999px;padding:2px 6px;margin-left:6px}.legend{pointer-events:auto;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:10px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.e{background:var(--e)}.w{background:var(--w)}.n{background:var(--n)}
.events{position:absolute;left:max(10px,env(safe-area-inset-left));top:106px;width:270px;max-height:calc(100% - 230px);overflow:auto;padding:9px}.ev{padding:7px 8px;border-left:2px solid #ffffff20;margin-bottom:5px;background:#ffffff05;border-radius:0 7px 7px 0;cursor:pointer}.ev.on{border-left-color:#e7cc67;background:#e7cc6713}.ev b{font-size:12px}.ev small{display:block;color:#d5c66f;font-size:10px}.ev span{display:block;color:#bcb6a7;font-size:10px;line-height:1.45;margin-top:2px}.unc{color:#d7bc75!important}
.controls{position:absolute;right:max(10px,env(safe-area-inset-right));top:106px;width:220px;padding:9px}.controls label{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:6px 0;border-bottom:1px solid #ffffff10}.controls button,.play,.speed{border:1px solid #ffffff20;background:#ffffff0d;color:var(--ink);border-radius:8px;padding:7px 9px}.views{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.views button{font-size:10px}.timeline{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));padding:9px 10px}.row{display:flex;align-items:center;gap:8px}.clock{font:18px ui-monospace,SFMono-Regular,Menlo,monospace;color:#f3dc80}.phase{font-size:11px;color:#c9c3b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.timeline input{width:100%;accent-color:#d8c365}.ticks{display:flex;justify-content:space-between;color:#8e897e;font-size:8px}.labels{position:absolute;inset:0;pointer-events:none}.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:#090b09c9;border:1px solid #ffffff17;border-radius:5px;padding:3px 5px;font-size:9px}.lab b{display:block;font-size:10px}.lab.east{border-left:3px solid var(--e)}.lab.west{border-left:3px solid var(--w)}.lab.neutral{border-left:3px solid var(--n)}.mobileBtn{display:none;position:absolute;right:10px;top:102px;z-index:8}.toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);max-width:84vw;background:#121612ee;border:1px solid #d7be6740;border-radius:9px;padding:7px 10px;font-size:10px;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
@media(max-width:840px){.legend{display:none}.sub{display:none}.title{max-width:82vw}.events{left:10px;right:10px;top:auto;bottom:104px;width:auto;max-height:24vh}.controls{display:none;right:10px;top:140px;z-index:7}.controls.open{display:block}.mobileBtn{display:block}.timeline{left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom))}.lab{font-size:8px}.lab b{font-size:9px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

</head>
<body><div id="app">
<canvas id="scene"></canvas>
<div class="top"><div class="card title"><div class="eyebrow">SEKIGAHARA / 21 OCT 1600</div><h1>関ヶ原の戦い <span class="badge" id="badge">GPT-5.6 Sol</span></h1><div class="sub">軽量インタラクティブ3D戦況図</div></div><div class="card legend"><span><i class="dot e"></i> 東軍</span><span><i class="dot w"></i> 西軍</span><span><i class="dot n"></i> 去就未定</span></div></div>
<button class="mobileBtn controlsBtn">表示設定</button>
<div class="card events" id="events"></div>
<div class="card controls" id="controls"><label>部隊ラベル <input id="showLabels" type="checkbox" checked></label><label>攻撃線 <input id="showPaths" type="checkbox" checked></label><label>朝霧 <input id="showFog" type="checkbox" checked></label><div class="views"><button data-v="all">俯瞰</button><button data-v="ishida">三成</button><button data-v="ieyasu">家康</button><button data-v="kobayakawa">松尾山</button></div><p style="font-size:9px;color:#928d82;line-height:1.45">教育用の模式図。兵力・時刻・小早川秀秋の決断過程には諸説があります。</p></div>
<div class="toast" id="toast"></div><div class="labels" id="labels"></div>
<div class="card timeline"><div class="row"><button class="play" id="play">▶</button><div class="clock" id="clock">06:00</div><div class="phase" id="phase"></div><button class="speed" id="speed">×1</button></div><input id="time" type="range" min="330" max="900" value="360"><div class="ticks"><span>05:30</span><span>08:00</span><span>10:00</span><span>12:00</span><span>14:00</span><span>15:00</span></div></div>
</div>
<script>
(()=>{
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
if(!window.THREE){document.body.innerHTML='<div style="padding:24px;color:white">3Dライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。</div>';return}
const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), mobile=ios||/Android/i.test(navigator.userAgent)||matchMedia('(max-width:840px)').matches||matchMedia('(pointer:coarse)').matches;
q('#badge').textContent=mobile?'GPT-5.6 Sol · mobile lite':'GPT-5.6 Sol';
const canvas=q('#scene');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:!mobile,alpha:false,powerPreference:mobile?'low-power':'high-performance'})}catch(e){document.body.innerHTML='<div style="padding:24px;color:white">この端末では3D表示を開始できませんでした。</div>';return}
renderer.setPixelRatio(mobile?1:Math.min(devicePixelRatio,1.6));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=false;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x182019);scene.fog=new THREE.FogExp2(0xb9c0b3,.024);
const cam=new THREE.PerspectiveCamera(48,1,.1,220);cam.position.set(0,48,62);const orbit=new THREE.OrbitControls(cam,canvas);orbit.enableDamping=true;orbit.dampingFactor=.08;orbit.maxPolarAngle=1.48;orbit.minDistance=17;orbit.maxDistance=100;
scene.add(new THREE.HemisphereLight(0xe6eadb,0x2c362b,1.25));const sun=new THREE.DirectionalLight(0xffe8bd,1.1);sun.position.set(-20,35,18);scene.add(sun);
const hill=(x,z,cx,cz,h,sx,sz)=>h*Math.exp(-((x-cx)**2/(2*sx*sx)+(z-cz)**2/(2*sz*sz)));const H=(x,z)=>.25*Math.sin(x*.15)*Math.cos(z*.12)+hill(x,z,-24,-12,6,10,13)+hill(x,z,22,22,11,12,11)+hill(x,z,36,-12,6,14,12)+hill(x,z,-38,14,8,12,15)-hill(x,z,0,2,1.8,25,21);
const seg=mobile?34:64,g=new THREE.PlaneGeometry(100,100,seg,seg);g.rotateX(-Math.PI/2);const pa=g.attributes.position;for(let i=0;i<pa.count;i++)pa.setY(i,H(pa.getX(i),pa.getZ(i)));pa.needsUpdate=true;g.computeVertexNormals();scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0x56654d})));
const grid=new THREE.GridHelper(100,20,0x87927e,0x66715f);grid.position.y=.12;grid.material.opacity=.12;grid.material.transparent=true;scene.add(grid);
const C={east:0xe85b55,west:0x4f7fd1,neutral:0xc7a64b};
const U=[['ishida','石田三成','west',6000,-24,-12,'笹尾山'],['ukita','宇喜多秀家','west',17000,2,8,'西軍主力'],['konishi','小西行長','west',6000,-9,13,'北天満山'],['otani','大谷吉継','west',4100,14,20,'松尾山警戒'],['shimazu','島津義弘','west',1500,-3,-7,'中央後方'],['kobayakawa','小早川秀秋','neutral',15000,23,23,'松尾山'],['wakisaka','脇坂安治ら','neutral',4200,19,15,'松尾山麓'],['fukushima','福島正則','east',6000,15,5,'東軍先鋒'],['ii','井伊直政・松平忠吉','east',3600,8,-1,'開戦の端緒'],['kuroda','黒田長政・竹中重門','east',5000,-12,-18,'石田隊正面'],['todo','藤堂高虎・京極高知','east',5500,18,11,'大谷隊正面'],['ieyasu','徳川家康','east',30000,36,-15,'東軍総大将']].map(a=>({id:a[0],name:a[1],side:a[2],troops:a[3],start:[a[4],a[5]],role:a[6]}));
const meshes={},labs={};U.forEach(u=>{const s=1.2+Math.sqrt(u.troops/1000)*.55,m=new THREE.Mesh(new THREE.CylinderGeometry(s*.8,s,1.25,mobile?10:16),new THREE.MeshLambertMaterial({color:C[u.side]}));scene.add(m);meshes[u.id]=m;const el=document.createElement('div');el.className='lab '+u.side;el.innerHTML='<b>'+u.name+'</b>'+u.role+' · 約'+u.troops.toLocaleString();q('#labels').append(el);labs[u.id]=el});
const events=[
[360,'濃霧の布陣','夜明け。関ヶ原盆地を霧が覆い、両軍が布陣を固める。'],[480,'開戦','井伊直政・松平忠吉が宇喜多隊へ発砲し、戦闘が広がる。'],[510,'各所で激戦','宇喜多・石田・大谷各隊と東軍諸隊が激しく交戦。'],[660,'家康、本陣を前進','家康が戦況把握のため前方へ本陣を移す。'],[705,'松尾山、なお動かず','小早川秀秋の大軍は高所に留まる。'],[720,'小早川隊が大谷隊へ','小早川隊が山を下り大谷隊を攻撃。西軍の均衡が崩れる。','正確な時刻・経緯には諸説'],[730,'脇坂らも東軍側へ','脇坂安治らも大谷隊を攻め、西軍右翼が崩壊。'],[765,'西軍、総崩れ','大谷隊壊滅を契機に西軍各隊が退却。'],[800,'島津の退却','島津勢が敵中を突破して戦場を離脱。'],[840,'勝敗決す','関ヶ原の戦いは東軍の勝利に帰した。']].map(x=>({t:x[0],name:x[1],desc:x[2],unc:x[3]}));
const ER=q('#events');ER.innerHTML='<div style="font-size:10px;color:#d7c77a;margin-bottom:6px">戦況タイムライン</div>';events.forEach((e,i)=>{const d=document.createElement('div');d.className='ev';d.innerHTML='<small>'+fmt(e.t)+'</small><b>'+e.name+'</b><span>'+e.desc+'</span>'+(e.unc?'<span class="unc">'+e.unc+'</span>':'');d.onclick=()=>setT(e.t);d.dataset.i=i;ER.append(d)});
function fmt(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.floor(v%60)).padStart(2,'0')}const clamp=v=>Math.max(0,Math.min(1,v)),sm=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)},mix=(a,b,k)=>a+(b-a)*k;
function pos(u,t){let[x,z]=u.start;if(u.id==='ieyasu'){let k=sm(645,690,t);x=mix(36,7,k);z=mix(-15,-11,k)}if(u.id==='ii'){let k=sm(475,515,t);x=mix(8,4,k);z=mix(-1,6,k)}if(u.id==='fukushima'){let k=sm(480,610,t);x=mix(15,6,k);z=mix(5,7,k)}if(u.id==='kuroda'){let k=sm(485,680,t);x=mix(-12,-20,k);z=mix(-18,-12,k)}if(u.id==='todo'){let k=sm(490,660,t);x=mix(18,15,k);z=mix(11,19,k)}if(u.id==='ukita'){let k=sm(500,680,t);x=mix(2,1,k);z=mix(8,5,k);let r=sm(760,825,t);x=mix(x,-18,r);z=mix(z,24,r)}if(u.id==='ishida'){let r=sm(760,835,t);x=mix(-24,-36,r);z=mix(-12,-1,r)}if(u.id==='konishi'){let r=sm(760,820,t);x=mix(-9,-29,r);z=mix(13,29,r)}if(u.id==='otani'){let k=sm(710,760,t);x=mix(14,17,k);z=mix(20,18,k)}if(u.id==='kobayakawa'){let k=sm(710,760,t);x=mix(23,16,k);z=mix(23,20,k)}if(u.id==='wakisaka'){let k=sm(720,760,t);x=mix(19,16,k);z=mix(15,19,k)}if(u.id==='shimazu'){let r=sm(790,845,t);x=mix(-3,34,r);z=mix(-7,40,r)}return[x,z]}
const defs=[['ii','ukita',480,540],['fukushima','ukita',485,660],['kuroda','ishida',490,720],['todo','otani',500,720],['kobayakawa','otani',720,780],['wakisaka','otani',725,785]],lines=defs.map(d=>{const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.Float32BufferAttribute([0,0,0,0,0,0],3));const l=new THREE.Line(gg,new THREE.LineBasicMaterial({color:C[U.find(u=>u.id===d[0]).side],transparent:true,opacity:0}));l.userData=d;l.frustumCulled=false;scene.add(l);return l});
let t=360,playing=false,speed=1,last=performance.now(),lastDraw=0,lastLab=0;
function updateWorld(){U.forEach(u=>{const p=pos(u,t),m=meshes[u.id];m.position.set(p[0],H(...p)+.7,p[1]);const defect=(u.id==='kobayakawa'||u.id==='wakisaka')&&t>=720;m.material.color.setHex(C[defect?'east':u.side]);labs[u.id].className='lab '+(defect?'east':u.side);m.visible=!(u.id==='otani'&&t>795)&&!(u.id==='ukita'&&t>855)&&!(u.id==='konishi'&&t>850)&&!(u.id==='ishida'&&t>865)});lines.forEach(l=>{const[f,to,a,b]=l.userData,A=pos(U.find(u=>u.id===f),t),B=pos(U.find(u=>u.id===to),t),p=l.geometry.attributes.position;p.setXYZ(0,A[0],H(...A)+.8,A[1]);p.setXYZ(1,B[0],H(...B)+.8,B[1]);p.needsUpdate=true;l.material.opacity=q('#showPaths').checked&&t>=a&&t<=b?.55:0});scene.fog.density=q('#showFog').checked?.004+.022*(1-sm(430,500,t)):.0025}
function updateUI(){q('#clock').textContent=fmt(t);q('#time').value=t;let cur=events[0];events.forEach(e=>{if(t>=e.t)cur=e});q('#phase').textContent=cur.desc;qa('.ev').forEach((d,i)=>d.classList.toggle('on',events[i]===cur))}
function setT(v){t=+v;updateWorld();updateUI()}q('#time').oninput=e=>setT(e.target.value);q('#play').onclick=()=>{playing=!playing;q('#play').textContent=playing?'❚❚':'▶'};q('#speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;q('#speed').textContent='×'+speed};q('.controlsBtn').onclick=()=>q('#controls').classList.toggle('open');q('#showLabels').onchange=e=>q('#labels').style.display=e.target.checked?'block':'none';q('#showPaths').onchange=updateWorld;q('#showFog').onchange=updateWorld;
const views={all:[[0,48,62],[0,0,0]],ishida:[[-28,14,-16],[0,0,6]],ieyasu:[[10,13,-19],[-10,0,-1]],kobayakawa:[[27,20,28],[4,0,4]]};qa('[data-v]').forEach(b=>b.onclick=()=>{const v=views[b.dataset.v];cam.position.set(...v[0]);orbit.target.set(...v[1]);orbit.update()});
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}}
function labels(now){if(mobile&&now-lastLab<80)return;lastLab=now;const w=innerWidth,h=innerHeight;U.forEach(u=>{const m=meshes[u.id],e=labs[u.id];if(!m.visible){e.style.opacity=0;return}const v=m.position.clone();v.y+=2;v.project(cam);e.style.left=(v.x*.5+.5)*w+'px';e.style.top=(-v.y*.5+.5)*h+'px';e.style.opacity=v.z>-1&&v.z<1?1:0})}
function frame(now){requestAnimationFrame(frame);if(document.hidden)return;if(mobile&&now-lastDraw<33)return;const dt=Math.min((now-last)/1000,.1);last=now;lastDraw=now;resize();if(playing){t+=dt*10*speed;if(t>900){t=330;playing=false;q('#play').textContent='▶'}updateWorld();updateUI()}orbit.update();labels(now);renderer.render(scene,cam)}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();playing=false;q('#toast').textContent='3D表示を一時停止しました。再読み込みすると復帰します。';q('#toast').classList.add('on')},{passive:false});
setT(360);requestAnimationFrame(frame);
})();
</script></body></html>
