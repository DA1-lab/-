<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>関ヶ原ベンチマーク — GPT-5.6 Sol</title>
<style>
  :root{
    --ink:#efe9d2; --muted:#b8b29f; --east:#e6544d; --west:#4b78c7; --neutral:#c8a24d;
    --panel:rgba(16,18,17,.84); --panel2:rgba(27,29,27,.72); --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f1110;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
  #app{position:relative;width:100%;height:100%}
  #scene{position:absolute;inset:0;display:block;touch-action:none}
  .scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 25%,transparent 70%,rgba(0,0,0,.5))}
  .topbar{position:absolute;left:18px;right:18px;top:16px;display:flex;gap:14px;align-items:flex-start;pointer-events:none}
  .titlebox{background:linear-gradient(135deg,rgba(19,21,19,.94),rgba(28,31,28,.72));border:1px solid var(--line);backdrop-filter:blur(12px);padding:13px 15px;border-radius:14px;box-shadow:0 14px 50px rgba(0,0,0,.25);max-width:min(650px,72vw)}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:#c7b978;text-transform:uppercase}
  h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600;font-size:clamp(21px,3vw,34px);margin:2px 0 1px;letter-spacing:.05em}
  .subtitle{font-size:12px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:3px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.14);font-size:10px;color:#d8d2be}
  .legend{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
  .chip{background:rgba(17,19,18,.83);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:999px;padding:8px 10px;font-size:11px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.16)}
  .dot{width:8px;height:8px;border-radius:50%}.east{background:var(--east)}.west{background:var(--west)}.neutral{background:var(--neutral)}
  .leftpanel{position:absolute;left:18px;top:115px;width:min(300px,34vw);max-height:calc(100vh - 250px);overflow:auto;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(13px);border-radius:14px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
  .paneltitle{font-size:11px;letter-spacing:.12em;color:#d0c59e;margin-bottom:8px}.event{padding:9px 9px 10px;border-left:2px solid rgba(255,255,255,.12);margin:2px 0 7px;background:rgba(255,255,255,.025);border-radius:0 8px 8px 0}.event.active{border-left-color:#d9c36c;background:rgba(217,195,108,.08)}
  .event .time{font-variant-numeric:tabular-nums;font-size:11px;color:#d8c96f}.event .name{font-size:13px;font-weight:700;margin-top:1px}.event .desc{font-size:11px;line-height:1.5;color:#bcb7a8;margin-top:3px}.event .uncertain{display:inline-block;margin-top:4px;font-size:9px;padding:2px 5px;border:1px solid #8a7545;border-radius:5px;color:#d6bd75}
  .rightpanel{position:absolute;right:18px;top:115px;width:235px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(13px);border-radius:14px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
  .controlrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:11px;cursor:pointer}.btn:hover,.btn.active{background:rgba(217,195,108,.16);border-color:rgba(217,195,108,.35)}
  .switchrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px}.switchrow:last-child{border-bottom:0}.switch{width:34px;height:20px;border-radius:999px;background:#343834;position:relative;cursor:pointer;border:1px solid rgba(255,255,255,.12)}.switch:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#c8c3b5;left:2px;top:2px;transition:.18s}.switch.on{background:#6d6541}.switch.on:after{left:16px;background:#eee2a9}
  .select{width:100%;background:#232622;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:11px}
  .bottombar{position:absolute;left:18px;right:18px;bottom:16px;background:linear-gradient(180deg,rgba(24,26,24,.84),rgba(14,15,14,.93));border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:15px;padding:10px 12px 11px;box-shadow:0 18px 60px rgba(0,0,0,.3)}
  .timelinehead{display:flex;align-items:center;gap:10px}.play{width:38px;height:34px;border-radius:10px;font-size:15px}.clock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;min-width:64px;color:#f0dc83}.phase{font-size:12px;color:#c9c4b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}.speed{font-size:10px;color:#aaa}
  #timeline{width:100%;accent-color:#d8c365;margin-top:6px}.ticks{display:flex;justify-content:space-between;font-size:9px;color:#8d8a80;margin:0 2px}
  .label{position:absolute;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;padding:4px 6px;border-radius:6px;background:rgba(10,11,10,.78);border:1px solid rgba(255,255,255,.12);font-size:10px;box-shadow:0 4px 14px rgba(0,0,0,.24);transition:opacity .18s}.label strong{display:block;font-size:11px}.label span{font-size:9px;color:#c1bcad}.label.eastside{border-left:3px solid var(--east)}.label.westside{border-left:3px solid var(--west)}.label.neutralside{border-left:3px solid var(--neutral)}
  .toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);max-width:min(680px,86vw);background:rgba(21,22,20,.9);border:1px solid rgba(219,194,103,.25);border-radius:12px;padding:9px 12px;font-size:11px;color:#d9d4c2;backdrop-filter:blur(10px);opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}
  .sourceNote{font-size:9px;color:#8f8b80;line-height:1.45;margin-top:8px}
  .mobileToggle{display:none;position:absolute;right:16px;top:104px;z-index:5}
  @media(max-width:840px){
    .topbar{left:10px;right:10px;top:10px}.titlebox{max-width:78vw;padding:10px 12px}.subtitle{display:none}.legend{display:none}
    .leftpanel{left:10px;top:auto;bottom:106px;width:calc(100vw - 20px);max-height:26vh;padding:9px}.rightpanel{display:none}.mobileToggle{display:block}
    .rightpanel.open{display:block;right:10px;top:144px;width:220px;z-index:4}.bottombar{left:10px;right:10px;bottom:10px}.label{font-size:9px}.label strong{font-size:10px}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas><div class="scrim"></div>
  <div class="topbar">
    <div class="titlebox">
      <div class="eyebrow">SEKIGAHARA / 21 OCT 1600</div>
      <h1>関ヶ原の戦い <span class="badge">GPT-5.6 Sol benchmark</span></h1>
      <div class="subtitle">インタラクティブ3D戦況図 — 布陣・戦況推移・史料上の不確実性を一画面で追う</div>
    </div>
    <div class="legend">
      <div class="chip"><i class="dot east"></i>東軍</div><div class="chip"><i class="dot west"></i>西軍</div><div class="chip"><i class="dot neutral"></i>去就未定 / 内応勢</div>
    </div>
  </div>

  <button class="btn mobileToggle" id="mobileSettings">表示設定</button>
  <div class="leftpanel" id="eventPanel"><div class="paneltitle">戦況タイムライン</div><div id="events"></div></div>
  <div class="rightpanel" id="rightPanel">
    <div class="paneltitle">表示・解釈</div>
    <select class="select" id="histMode">
      <option value="careful">慎重モード（不確実性を明示）</option>
      <option value="classic">通説モード（定番の物語を強調）</option>
    </select>
    <div class="switchrow"><span>部隊ラベル</span><div class="switch on" data-toggle="labels"></div></div>
    <div class="switchrow"><span>移動・攻撃線</span><div class="switch on" data-toggle="paths"></div></div>
    <div class="switchrow"><span>朝霧</span><div class="switch on" data-toggle="fog"></div></div>
    <div class="switchrow"><span>兵力スケール</span><div class="switch on" data-toggle="scale"></div></div>
    <div class="paneltitle" style="margin-top:11px">視点</div>
    <div class="controlrow"><button class="btn active" data-view="overview">俯瞰</button><button class="btn" data-view="ishida">三成</button><button class="btn" data-view="ieyasu">家康</button><button class="btn" data-view="kobayakawa">松尾山</button></div>
    <div class="sourceNote">地形・部隊位置は教育用の模式表現。兵力は史料・研究で差があるため概数。家康の「問鉄砲」は一説として扱う。</div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="labels"></div>
  <div class="bottombar">
    <div class="timelinehead">
      <button class="btn play" id="play">▶</button><div class="clock" id="clock">06:00</div><div class="phase" id="phase">濃霧の関ヶ原。両軍が布陣を固める。</div><div class="spacer"></div><button class="btn" id="speed">×1</button>
    </div>
    <input id="timeline" type="range" min="330" max="900" step="1" value="360" />
    <div class="ticks"><span>05:30</span><span>08:00</span><span>10:00</span><span>12:00</span><span>14:00</span><span>15:00</span></div>
  </div>
</div>
<script>
(function(){
  if(!window.THREE){ document.body.innerHTML='<div style="padding:30px;color:white;font-family:sans-serif">3Dライブラリを読み込めませんでした。ネット接続のあるブラウザで開いてください。</div>'; return; }

  const canvas=document.getElementById('scene');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputEncoding=THREE.sRGBEncoding; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1b211d); scene.fog=new THREE.FogExp2(0xbcc0b3,0.012);
  const camera=new THREE.PerspectiveCamera(48,1,.1,350); camera.position.set(0,54,68);
  const controls=new THREE.OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.07; controls.maxPolarAngle=Math.PI*.47; controls.minDistance=18; controls.maxDistance=120; controls.target.set(0,0,0);

  const hemi=new THREE.HemisphereLight(0xdce2cf,0x293126,1.25); scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xffedc8,1.35); sun.position.set(-25,42,20); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-80; sun.shadow.camera.right=80; sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80; scene.add(sun);

  // Terrain: stylized basin with Sasao-yama (NW), Matsuo-yama (SE), Momokubari-yama (E).
  const size=110, seg=140; const geo=new THREE.PlaneGeometry(size,size,seg,seg); geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  function hill(x,z,cx,cz,h,sx,sz){return h*Math.exp(-(((x-cx)*(x-cx))/(2*sx*sx)+((z-cz)*(z-cz))/(2*sz*sz)));}
  function heightAt(x,z){
    let y=.45*Math.sin(x*.12)*Math.cos(z*.10)+.25*Math.sin((x+z)*.22);
    y+=hill(x,z,-27,-13,8,10,14); // Sasao
    y+=hill(x,z,24,23,15,13,12);  // Matsuo
    y+=hill(x,z,38,-14,8,15,13);  // Momokubari
    y+=hill(x,z,-43,14,12,12,16); // western ridges
    y+=hill(x,z,5,42,7,25,12);    // southern ridge
    y-=hill(x,z,0,2,2.4,25,22);   // basin
    return y;
  }
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,heightAt(x,z));} pos.needsUpdate=true; geo.computeVertexNormals();
  const terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x566249,roughness:.94,metalness:0,vertexColors:false})); terrain.receiveShadow=true; scene.add(terrain);
  const grid=new THREE.GridHelper(110,22,0x899079,0x65705e); grid.position.y=.18; grid.material.transparent=true; grid.material.opacity=.13; scene.add(grid);

  // Roads/streams as ribbons.
  function ribbon(points,color,width=.35,opacity=.55){
    const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity}); const pts=points.map(p=>new THREE.Vector3(p[0],heightAt(p[0],p[1])+.25,p[1])); const g=new THREE.BufferGeometry().setFromPoints(pts); const line=new THREE.Line(g,mat); scene.add(line); return line;
  }
  ribbon([[-48,8],[-30,5],[-12,2],[6,0],[24,-2],[48,-6]],0xd5c79f,.4,.55); // Nakasendo-ish
  ribbon([[-10,-48],[-7,-28],[-8,-10],[-6,3],[-2,17],[1,45]],0xb59f75,.3,.35);
  ribbon([[-45,-20],[-28,-16],[-12,-10],[8,-12],[30,-15],[48,-18]],0x597f91,.3,.42);

  // Landmarks.
  function landmark(name,x,z){
    const y=heightAt(x,z); const g=new THREE.CylinderGeometry(.12,.12,2.5,8); const m=new THREE.MeshStandardMaterial({color:0xd4c57e}); const p=new THREE.Mesh(g,m);p.position.set(x,y+1.25,z);scene.add(p);
    const ring=new THREE.Mesh(new THREE.RingGeometry(.8,1.0,24),new THREE.MeshBasicMaterial({color:0xd4c57e,side:THREE.DoubleSide,transparent:true,opacity:.5}));ring.rotation.x=-Math.PI/2;ring.position.set(x,y+.18,z);scene.add(ring);
  }
  landmark('決戦地',-11,-1); landmark('開戦地',5,11);

  const COLORS={east:0xe6544d,west:0x4b78c7,neutral:0xc8a24d};
  const units=[
    {id:'ishida',name:'石田三成',side:'west',troops:6000,start:[-26,-13],role:'笹尾山'},
    {id:'ukita',name:'宇喜多秀家',side:'west',troops:17000,start:[2,8],role:'西軍主力'},
    {id:'konishi',name:'小西行長',side:'west',troops:6000,start:[-10,13],role:'北天満山方面'},
    {id:'otani',name:'大谷吉継',side:'west',troops:4100,start:[14,21],role:'松尾山を警戒'},
    {id:'shimazu',name:'島津義弘',side:'west',troops:1500,start:[-3,-7],role:'中央後方'},
    {id:'kobayakawa',name:'小早川秀秋',side:'neutral',troops:15000,start:[25,24],role:'松尾山'},
    {id:'wakisaka',name:'脇坂安治ら',side:'neutral',troops:4200,start:[20,15],role:'松尾山麓'},
    {id:'fukushima',name:'福島正則',side:'east',troops:6000,start:[16,5],role:'東軍先鋒'},
    {id:'ii',name:'井伊直政・松平忠吉',side:'east',troops:3600,start:[8,-1],role:'開戦の端緒'},
    {id:'kuroda',name:'黒田長政・竹中重門',side:'east',troops:5000,start:[-13,-19],role:'岡山烽火場'},
    {id:'todo',name:'藤堂高虎・京極高知',side:'east',troops:5500,start:[19,11],role:'大谷隊正面'},
    {id:'ieyasu',name:'徳川家康',side:'east',troops:30000,start:[39,-15],role:'東軍総大将'},
  ];

  const group=new THREE.Group(); scene.add(group); const meshes={}, labels={}, pathGroup=new THREE.Group(); scene.add(pathGroup);
  function unitScale(u){ return 1.3 + Math.sqrt(u.troops/1000)*.65; }
  units.forEach(u=>{
    const s=unitScale(u); const g=new THREE.CylinderGeometry(s*.82,s,1.45,24); const mat=new THREE.MeshStandardMaterial({color:COLORS[u.side],roughness:.55,metalness:.05}); const mesh=new THREE.Mesh(g,mat); mesh.castShadow=true; mesh.userData=u; group.add(mesh); meshes[u.id]=mesh;
    const halo=new THREE.Mesh(new THREE.RingGeometry(s*1.02,s*1.18,28),new THREE.MeshBasicMaterial({color:COLORS[u.side],side:THREE.DoubleSide,transparent:true,opacity:.55})); halo.rotation.x=-Math.PI/2; mesh.add(halo); halo.position.y=-.72;
    const el=document.createElement('div'); el.className='label '+(u.side==='east'?'eastside':u.side==='west'?'westside':'neutralside'); el.innerHTML='<strong>'+u.name+'</strong><span>'+u.role+' · 約'+u.troops.toLocaleString()+'</span>'; document.getElementById('labels').appendChild(el); labels[u.id]=el;
  });

  const pathDefs=[
    {from:'ii',to:'ukita',start:480,end:540},{from:'fukushima',to:'ukita',start:485,end:660},{from:'kuroda',to:'ishida',start:490,end:720},{from:'todo',to:'otani',start:500,end:720},{from:'kobayakawa',to:'otani',start:720,end:780},{from:'wakisaka',to:'otani',start:725,end:785},{from:'ieyasu',to:'ishida',start:660,end:760}
  ];
  const pathMeshes=[];
  pathDefs.forEach(pd=>{const m=new THREE.LineBasicMaterial({color:COLORS[units.find(u=>u.id===pd.from).side],transparent:true,opacity:.0});const g=new THREE.BufferGeometry();const line=new THREE.Line(g,m);line.userData=pd;pathGroup.add(line);pathMeshes.push(line);});

  const events=[
    {t:360,name:'濃霧の布陣',desc:'夜明け。関ヶ原盆地を霧が覆い、両軍がそれぞれの陣を固める。'},
    {t:480,name:'開戦',desc:'井伊直政・松平忠吉が宇喜多隊に発砲。続いて福島隊などが戦闘に入る。'},
    {t:510,name:'各所で激戦',desc:'宇喜多隊は福島隊、石田隊は黒田・細川ら、大谷隊は藤堂・京極らと交戦。'},
    {t:660,name:'家康、本陣を前進',desc:'戦況把握のため、家康が桃配山方面から三成陣正面に近い位置へ本陣を移す。'},
    {t:705,name:'松尾山、なお動かず',desc:'小早川秀秋の大軍は高所に留まり、戦場全体を見下ろす。'},
    {t:720,name:'小早川隊が大谷隊へ',desc:'小早川隊が山を下り大谷隊を攻撃。西軍の均衡が崩れ始める。',uncertain:'正確な時刻・経緯には諸説'},
    {t:730,name:'脇坂らも東軍側へ',desc:'脇坂安治らの諸隊も大谷隊を攻め、西軍右翼が崩壊。'},
    {t:765,name:'西軍、総崩れ',desc:'大谷隊壊滅を契機に小西・宇喜多・石田諸隊も退却。決戦地周辺へ東軍が殺到する。'},
    {t:800,name:'島津の退却',desc:'島津勢は敵中を突破して戦場を離脱。'},
    {t:840,name:'勝敗決す',desc:'天下分け目の戦いは半日ほどで東軍の勝利に帰した。'}
  ];
  const eventRoot=document.getElementById('events'); events.forEach((e,i)=>{const d=document.createElement('div');d.className='event';d.dataset.i=i;d.innerHTML='<div class="time">'+fmt(e.t)+'</div><div class="name">'+e.name+'</div><div class="desc">'+e.desc+'</div>'+(e.uncertain?'<span class="uncertain">'+e.uncertain+'</span>':'');d.onclick=()=>setTime(e.t);eventRoot.appendChild(d);});

  let t=360,playing=false,speed=1,last=performance.now(),settings={labels:true,paths:true,fog:true,scale:true},histMode='careful';
  function fmt(min){let h=Math.floor(min/60),m=Math.floor(min%60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
  function clamp01(v){return Math.max(0,Math.min(1,v))} function smooth(a,b,x){let q=clamp01((x-a)/(b-a));return q*q*(3-2*q)}
  function mix(a,b,k){return a+(b-a)*k}
  function posAt(u,time){ let x=u.start[0],z=u.start[1];
    if(u.id==='ieyasu'){let k=smooth(645,690,time);x=mix(39,7,k);z=mix(-15,-11,k);} 
    if(u.id==='ii'){let k=smooth(475,515,time);x=mix(8,4,k);z=mix(-1,6,k);} 
    if(u.id==='fukushima'){let k=smooth(480,610,time);x=mix(16,6,k);z=mix(5,7,k);} 
    if(u.id==='kuroda'){let k=smooth(485,680,time);x=mix(-13,-20,k);z=mix(-19,-12,k);} 
    if(u.id==='todo'){let k=smooth(490,660,time);x=mix(19,15,k);z=mix(11,19,k);} 
    if(u.id==='ukita'){let k=smooth(500,680,time);x=mix(2,1,k);z=mix(8,5,k);let r=smooth(760,825,time);x=mix(x,-18,r);z=mix(z,24,r);} 
    if(u.id==='ishida'){let r=smooth(760,835,time);x=mix(-26,-37,r);z=mix(-13,-1,r);} 
    if(u.id==='konishi'){let r=smooth(760,820,time);x=mix(-10,-30,r);z=mix(13,30,r);} 
    if(u.id==='otani'){let k=smooth(710,760,time);x=mix(14,17,k);z=mix(21,18,k);}
    if(u.id==='kobayakawa'){let k=smooth(710,760,time);x=mix(25,16,k);z=mix(24,20,k);} 
    if(u.id==='wakisaka'){let k=smooth(720,760,time);x=mix(20,16,k);z=mix(15,19,k);} 
    if(u.id==='shimazu'){let r=smooth(790,845,time);x=mix(-3,35,r);z=mix(-7,42,r);} 
    return [x,z];
  }
  function updateUnits(){
    units.forEach(u=>{const p=posAt(u,t),mesh=meshes[u.id];const y=heightAt(p[0],p[1]);mesh.position.set(p[0],y+.85,p[1]);const base=settings.scale?unitScale(u):2.6;mesh.scale.set(base/unitScale(u),1,base/unitScale(u));
      if((u.id==='kobayakawa'||u.id==='wakisaka') && t>=720){mesh.material.color.setHex(COLORS.east); labels[u.id].className='label eastside';}
      else {mesh.material.color.setHex(COLORS[u.side]); labels[u.id].className='label '+(u.side==='east'?'eastside':u.side==='west'?'westside':'neutralside');}
      mesh.visible=!(u.id==='otani'&&t>795) && !(u.id==='ukita'&&t>855) && !(u.id==='konishi'&&t>850) && !(u.id==='ishida'&&t>865);
    });
    pathMeshes.forEach(line=>{const pd=line.userData,fu=units.find(u=>u.id===pd.from),tu=units.find(u=>u.id===pd.to),a=posAt(fu,t),b=posAt(tu,t);const pts=[new THREE.Vector3(a[0],heightAt(a[0],a[1])+1.0,a[1]),new THREE.Vector3(b[0],heightAt(b[0],b[1])+1.0,b[1])];line.geometry.dispose();line.geometry=new THREE.BufferGeometry().setFromPoints(pts);const active=t>=pd.start&&t<=pd.end;line.material.opacity=settings.paths&&active?.58:0;});
  }
  function updateFog(){ if(!settings.fog){scene.fog.density=.0025;return;} const fade=1-smooth(430,500,t);scene.fog.density=.0035+.025*fade; renderer.setClearColor(new THREE.Color().setHSL(.25,.12,.10+.16*fade),1); }
  function updateUI(){document.getElementById('clock').textContent=fmt(t);document.getElementById('timeline').value=t; let current=events[0]; for(const e of events)if(t>=e.t)current=e; document.getElementById('phase').textContent=current.desc; document.querySelectorAll('.event').forEach((d,i)=>d.classList.toggle('active',events[i]===current));
    const classicExtra=(histMode==='classic'&&t>=675&&t<730)?'家康が小早川へ「問鉄砲」を放ったという有名な説があります。':'正確な戦闘時刻や小早川秀秋の決断過程には諸説があります。';
    if(Math.abs(t-690)<2||Math.abs(t-720)<2) toast(classicExtra);
  }
  function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast._x);toast._x=setTimeout(()=>e.classList.remove('show'),3800);}
  function setTime(v){t=+v;updateUnits();updateFog();updateUI();}
  document.getElementById('timeline').addEventListener('input',e=>setTime(e.target.value));
  document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'❚❚':'▶'};
  const speeds=[1,2,4], speedBtn=document.getElementById('speed');let si=0;speedBtn.onclick=()=>{si=(si+1)%speeds.length;speed=speeds[si];speedBtn.textContent='×'+speed};
  document.getElementById('histMode').onchange=e=>{histMode=e.target.value;toast(histMode==='careful'?'慎重モード：史料上の不確実性を明示します。':'通説モード：一般的な物語表現を強調します。')};
  document.querySelectorAll('.switch').forEach(sw=>sw.onclick=()=>{const k=sw.dataset.toggle;settings[k]=!settings[k];sw.classList.toggle('on',settings[k]); if(k==='labels')Object.values(labels).forEach(x=>x.style.display=settings.labels?'block':'none');updateUnits();updateFog();});
  document.getElementById('mobileSettings').onclick=()=>document.getElementById('rightPanel').classList.toggle('open');
  const views={overview:{p:[0,54,68],t:[0,0,0]},ishida:{p:[-29,16,-17],t:[2,0,7]},ieyasu:{p:[10,13,-20],t:[-11,0,-1]},kobayakawa:{p:[28,22,30],t:[3,0,4]}};
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const v=views[b.dataset.view];camera.position.set(...v.p);controls.target.set(...v.t);controls.update()});

  function updateLabels(){ if(!settings.labels)return; const w=innerWidth,h=innerHeight;units.forEach(u=>{const mesh=meshes[u.id],el=labels[u.id];if(!mesh.visible){el.style.opacity=0;return;}const v=mesh.position.clone();v.y+=2.2;v.project(camera);const visible=v.z>-1&&v.z<1;el.style.left=((v.x*.5+.5)*w)+'px';el.style.top=((-v.y*.5+.5)*h)+'px';el.style.opacity=visible?1:0;}); }
  function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w*renderer.getPixelRatio()||canvas.height!==h*renderer.getPixelRatio()){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
  function animate(now){requestAnimationFrame(animate);resize();const dt=Math.min((now-last)/1000,.1);last=now;if(playing){t+=dt*10*speed;if(t>900){t=330;playing=false;document.getElementById('play').textContent='▶'}updateUnits();updateFog();updateUI();}controls.update();updateLabels();renderer.render(scene,camera);}
  setTime(360);requestAnimationFrame(animate);
})();
</script>
</body>
